<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Pirámide de la dieta mediterránea por frecuencia de consumo</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<path d="M360.0,30 H480.0 L555.0,88 H285.0z" fill="#e76f51" stroke="#fff" stroke-width="3"/><text x="420.0" y="56.0" font-size="16" text-anchor="middle" font-weight="900" fill="#fff" >Ocasional</text>
<text x="420.0" y="76.0" font-size="12.5" text-anchor="middle" font-weight="800" fill="#fff" >carne roja, embutidos, dulces</text>
<path d="M285.0,92 H555.0 L630.0,150 H210.0z" fill="#f4a261" stroke="#fff" stroke-width="3"/><text x="420.0" y="118.0" font-size="16" text-anchor="middle" font-weight="900" fill="#22313f" >Semanal</text>
<text x="420.0" y="138.0" font-size="12.5" text-anchor="middle" font-weight="800" fill="#22313f" >pescado, legumbres, huevos, carne blanca</text>
<path d="M210.0,154 H630.0 L705.0,212 H135.0z" fill="#e9c46a" stroke="#fff" stroke-width="3"/><text x="420.0" y="180.0" font-size="16" text-anchor="middle" font-weight="900" fill="#22313f" >Diario</text>
<text x="420.0" y="200.0" font-size="12.5" text-anchor="middle" font-weight="800" fill="#22313f" >frutos secos, lácteos, especias, ajo y cebolla</text>
<path d="M135.0,216 H705.0 L780.0,274 H60.0z" fill="#8ab17d" stroke="#fff" stroke-width="3"/><text x="420.0" y="242.0" font-size="16" text-anchor="middle" font-weight="900" fill="#22313f" >En cada comida</text>
<text x="420.0" y="262.0" font-size="12.5" text-anchor="middle" font-weight="800" fill="#22313f" >cereales (mejor integrales), frutas, verduras, aceite de oliva</text>
<path d="M60.0,278 H780.0 L855.0,336 H-15.0z" fill="#2a9d8f" stroke="#fff" stroke-width="3"/><text x="420.0" y="304.0" font-size="16" text-anchor="middle" font-weight="900" fill="#fff" >Base</text>
<text x="420.0" y="324.0" font-size="12.5" text-anchor="middle" font-weight="800" fill="#fff" >agua · actividad física · alimentos de temporada · comer en compañía</text>
<text x="420.0" y="364.0" font-size="13" text-anchor="middle" font-weight="700" fill="#4c5b67" >Esquema basado en la pirámide de la dieta mediterránea (frecuencia de consumo).</text>
