<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 325" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Las vitaminas B2, B3 y B5 son precursoras de las coenzimas FAD, NAD y coenzima A</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<text x="420.0" y="30.0" font-size="18" text-anchor="middle" font-weight="900" fill="#0f4c81" >Muchas vitaminas B son precursoras de coenzimas</text>
<path d="M70,62.0 C75.0,76.0 86.0,84 86.0,93.0 A16,16 0 0 1 54.0,93.0 C54.0,84 65.0,76.0 70,62.0z" fill="#2a7fc1"/><text x="100.0" y="90.0" font-size="16" text-anchor="start" font-weight="900" fill="#2a7fc1" >B₂ (riboflavina)</text>
<line x1="300" y1="84" x2="360" y2="84" stroke="#22313f" stroke-width="3" marker-end="url(#fk)"/><rect x="370" y="62" width="150" height="44" rx="10" fill="#f4a261" stroke="#b5600f" stroke-width="2"/><text x="445.0" y="90.0" font-size="16" text-anchor="middle" font-weight="900" fill="#5a2a00" >FAD</text>
<line x1="530" y1="84" x2="560" y2="84" stroke="#22313f" stroke-width="3" marker-end="url(#fk)"/><text x="570.0" y="90.0" font-size="14" text-anchor="start" font-weight="800" fill="#4c5b67" >transporta electrones (respiración)</text>
<path d="M70,136.0 C75.0,150.0 86.0,158 86.0,167.0 A16,16 0 0 1 54.0,167.0 C54.0,158 65.0,150.0 70,136.0z" fill="#2a7fc1"/><text x="100.0" y="164.0" font-size="16" text-anchor="start" font-weight="900" fill="#2a7fc1" >B₃ (niacina)</text>
<line x1="300" y1="158" x2="360" y2="158" stroke="#22313f" stroke-width="3" marker-end="url(#fk)"/><rect x="370" y="136" width="150" height="44" rx="10" fill="#f4a261" stroke="#b5600f" stroke-width="2"/><text x="445.0" y="164.0" font-size="16" text-anchor="middle" font-weight="900" fill="#5a2a00" >NAD⁺ / NADP⁺</text>
<line x1="530" y1="158" x2="560" y2="158" stroke="#22313f" stroke-width="3" marker-end="url(#fk)"/><text x="570.0" y="164.0" font-size="14" text-anchor="start" font-weight="800" fill="#4c5b67" >transporta electrones (respiración, fotosíntesis)</text>
<path d="M70,210.0 C75.0,224.0 86.0,232 86.0,241.0 A16,16 0 0 1 54.0,241.0 C54.0,232 65.0,224.0 70,210.0z" fill="#2a7fc1"/><text x="100.0" y="238.0" font-size="16" text-anchor="start" font-weight="900" fill="#2a7fc1" >B₅ (ácido pantoténico)</text>
<line x1="300" y1="232" x2="360" y2="232" stroke="#22313f" stroke-width="3" marker-end="url(#fk)"/><rect x="370" y="210" width="150" height="44" rx="10" fill="#f4a261" stroke="#b5600f" stroke-width="2"/><text x="445.0" y="238.0" font-size="16" text-anchor="middle" font-weight="900" fill="#5a2a00" >coenzima A</text>
<line x1="530" y1="232" x2="560" y2="232" stroke="#22313f" stroke-width="3" marker-end="url(#fk)"/><text x="570.0" y="238.0" font-size="14" text-anchor="start" font-weight="800" fill="#4c5b67" >transporta grupos acetilo (ciclo de Krebs)</text>
<text x="420.0" y="310.0" font-size="14" text-anchor="middle" font-weight="800" fill="#c0392b" >Sin la vitamina no se forma la coenzima y la enzima que la necesita no funciona.</text>
</svg>
