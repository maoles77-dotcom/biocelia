<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Vitaminas hidrosolubles, C y grupo B, y liposolubles, A, D, E y K, con sus propiedades</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="20" y="20" width="360" height="300" rx="18" fill="#e3f1fb" stroke="#2a7fc1" stroke-width="3"/><text x="200.0" y="58.0" font-size="22" text-anchor="middle" font-weight="900" fill="#2a7fc1" >Hidrosolubles</text>
<path d="M70,78.5 C76.25,96.0 90.0,106 90.0,117.25 A16,16 0 0 1 50.0,117.25 C50.0,106 63.75,96.0 70,78.5z" fill="#2a7fc1"/><text x="70.0" y="120.0" font-size="15" text-anchor="middle" font-weight="900" fill="#fff" >C</text>
<path d="M122,78.5 C128.25,96.0 142.0,106 142.0,117.25 A16,16 0 0 1 102.0,117.25 C102.0,106 115.75,96.0 122,78.5z" fill="#2a7fc1"/><text x="122.0" y="120.0" font-size="15" text-anchor="middle" font-weight="900" fill="#fff" >B₁</text>
<path d="M174,78.5 C180.25,96.0 194.0,106 194.0,117.25 A16,16 0 0 1 154.0,117.25 C154.0,106 167.75,96.0 174,78.5z" fill="#2a7fc1"/><text x="174.0" y="120.0" font-size="15" text-anchor="middle" font-weight="900" fill="#fff" >B₂</text>
<path d="M226,78.5 C232.25,96.0 246.0,106 246.0,117.25 A16,16 0 0 1 206.0,117.25 C206.0,106 219.75,96.0 226,78.5z" fill="#2a7fc1"/><text x="226.0" y="120.0" font-size="15" text-anchor="middle" font-weight="900" fill="#fff" >B₃</text>
<path d="M278,78.5 C284.25,96.0 298.0,106 298.0,117.25 A16,16 0 0 1 258.0,117.25 C258.0,106 271.75,96.0 278,78.5z" fill="#2a7fc1"/><text x="278.0" y="120.0" font-size="15" text-anchor="middle" font-weight="900" fill="#fff" >B₉</text>
<path d="M330,78.5 C336.25,96.0 350.0,106 350.0,117.25 A16,16 0 0 1 310.0,117.25 C310.0,106 323.75,96.0 330,78.5z" fill="#2a7fc1"/><text x="330.0" y="120.0" font-size="15" text-anchor="middle" font-weight="900" fill="#fff" >B₁₂</text>
<text x="200.0" y="174.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >• solubles en agua</text>
<text x="200.0" y="206.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >• precursoras de coenzimas</text>
<text x="200.0" y="238.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >• el exceso se elimina por la orina</text>
<text x="200.0" y="270.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >• hay que tomarlas con regularidad</text>
<rect x="420" y="20" width="360" height="300" rx="18" fill="#fff4df" stroke="#c77d00" stroke-width="3"/><text x="600.0" y="58.0" font-size="22" text-anchor="middle" font-weight="900" fill="#c77d00" >Liposolubles</text>
<circle cx="522" cy="108" r="22" fill="#c77d00"/><text x="522.0" y="115.0" font-size="18" text-anchor="middle" font-weight="900" fill="#fff" >A</text>
<circle cx="574" cy="108" r="22" fill="#c77d00"/><text x="574.0" y="115.0" font-size="18" text-anchor="middle" font-weight="900" fill="#fff" >D</text>
<circle cx="626" cy="108" r="22" fill="#c77d00"/><text x="626.0" y="115.0" font-size="18" text-anchor="middle" font-weight="900" fill="#fff" >E</text>
<circle cx="678" cy="108" r="22" fill="#c77d00"/><text x="678.0" y="115.0" font-size="18" text-anchor="middle" font-weight="900" fill="#fff" >K</text>
<text x="600.0" y="174.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >• solubles en grasas (lípidos)</text>
<text x="600.0" y="206.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >• se absorben con las grasas</text>
<text x="600.0" y="238.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >• se acumulan en hígado y tejido graso</text>
<text x="600.0" y="270.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >• el exceso puede ser tóxico</text>
<text x="400.0" y="345.0" font-size="15" text-anchor="middle" font-weight="800" fill="#4c5b67" >Criterio de clasificación: su solubilidad en agua o en disolventes apolares.</text>
</svg>
