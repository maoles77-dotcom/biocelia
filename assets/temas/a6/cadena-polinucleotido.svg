<text x="130.0" y="534.0" font-size="14" text-anchor="middle" font-weight="900" fill="#0f4c81" >Extremo 3′ (–OH libre)</text>
<text x="340.0" y="140.0" font-size="14" text-anchor="start" font-weight="900" fill="#c77d00" >enlace fosfodiéster:</text>
<text x="340.0" y="160.0" font-size="13" text-anchor="start" font-weight="800" fill="#4c5b67" >fosfato entre el C3′ de un</text>
<text x="340.0" y="178.0" font-size="13" text-anchor="start" font-weight="800" fill="#4c5b67" >nucleótido y el C5′ del siguiente</text>
<text x="340.0" y="260.0" font-size="14" text-anchor="start" font-weight="900" fill="#0f4c81" >La secuencia de bases</text>
<text x="340.0" y="280.0" font-size="13" text-anchor="start" font-weight="800" fill="#4c5b67" >(5′ → 3′) es la estructura</text>
