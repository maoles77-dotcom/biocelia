<circle cx="464" cy="110" r="22" fill="#f7c948" stroke="#8a6d00" stroke-width="2.5"/><text x="464.0" y="116.6" font-size="19.8" text-anchor="middle" font-weight="900" fill="#6b5000" >P</text>
