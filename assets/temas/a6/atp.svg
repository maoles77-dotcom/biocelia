<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 355" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>ATP: adenina, ribosa y tres fosfatos con enlaces ricos en energía; su hidrólisis a ADP libera energía</title>
