<path d="M140,215 H540" stroke="#2a9d8f" stroke-width="3"/><text x="340.0" y="237.0" font-size="13" text-anchor="middle" font-weight="900" fill="#2a9d8f" >adenosina = adenina + ribosa (nucleósido)</text>
<text x="340.0" y="290.0" font-size="18" text-anchor="middle" font-weight="900" fill="#0f4c81" >ATP  →  ADP + Pi + energía</text>
<text x="340.0" y="318.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >hidrólisis: libera energía para el trabajo celular (síntesis, transporte, contracción)</text>
<text x="340.0" y="340.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >ADP + Pi + energía → ATP: en la respiración y la fotosíntesis (fosforilación)</text>
