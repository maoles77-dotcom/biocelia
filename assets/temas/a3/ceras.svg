<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Una cera es el éster de un ácido graso y un monoalcohol de cadena larga; forma la cutícula impermeable de las hojas</title>
