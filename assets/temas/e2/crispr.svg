0.0" y1="205.0" x2="390.0" y2="231.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><line x1="410.0" y1="205.0" x2="410.0" y2="231.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><line x1="430.0" y1="205.0" x2="430.0" y2="231.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><line x1="450.0" y1="205.0" x2="450.0" y2="231.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><line x1="470.0" y1="205.0" x2="470.0" y2="231.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><line x1="490.0" y1="205.0" x2="490.0" y2="231.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><line x1="510.0" y1="205.0" x2="510.0" y2="231.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><line x1="530.0" y1="205.0" x2="530.0" y2="231.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><line x1="550.0" y1="205.0" x2="550.0" y2="231.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><line x1="570.0" y1="205.0" x2="570.0" y2="231.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><line x1="590.0" y1="205.0" x2="590.0" y2="231.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><line x1="610.0" y1="205.0" x2="610.0" y2="231.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><rect x="250" y="190" width="200" height="56" rx="8" fill="none" stroke="#c77d00" stroke-width="2.5" stroke-dasharray="6 4"/><text x="350.0" y="280.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c77d00" >secuencia diana (gen que se quiere editar)</text>
<path d="M210,170 C190,90 290,60 350,70 C440,60 500,100 490,170 C480,270 440,290 350,282 C260,290 220,250 210,170Z" fill="#6d3fc0" opacity="0.25" stroke="#6d3fc0" stroke-width="3"/><text x="350.0" y="100.0" font-size="20" text-anchor="middle" font-weight="900" fill="#6d3fc0" >Cas9</text>
<text x="350.0" y="120.0" font-size="12.5" text-anchor="middle" font-weight="900" fill="#6d3fc0" >(endonucleasa)</text>
<path d="M270,178 H430 q30,0 40,-40 q10,-30 50,-30" fill="none" stroke="#c0392b" stroke-width="5"/><text x="530.0" y="122.0" font-size="15" text-anchor="start" font-weight="900" fill="#c0392b" >ARN guía</text>
<text x="530.0" y="140.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >complementario de la</text>
<text x="530.0" y="156.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >secuencia diana</text>
<text x="350.0" y="224.0" font-size="26" text-anchor="middle" font-weight="900" fill="#c0392b" >✂</text>
<text x="350.0" y="330.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#22313f" >Cas9 corta las dos hebras en el punto exacto que indica el ARN guía</text>
<line x1="640.0" y1="218.0" x2="700.0" y2="160.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><line x1="640.0" y1="218.0" x2="700.0" y2="280.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><rect x="720.0" y="115.0" width="300" height="70" rx="12" fill="#e3eef8" stroke="#0f4c81" stroke-width="2.5"/><text x="870.0" y="147.0" font-size="15" text-anchor="middle" font-weight="900" fill="#0f4c81" >Inactivar el gen</text>
<text x="870.0" y="165.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >la célula repara el corte con errores</text>
<rect x="720.0" y="255.0" width="300" height="70" rx="12" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2.5"/><text x="870.0" y="287.0" font-size="15" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Corregir o insertar</text>
<text x="870.0" y="305.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >se aporta un ADN molde con la secuencia correcta</text>
<text x="560.0" y="380.0" font-size="12.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >Origen: sistema de defensa de bacterias y arqueas frente a virus. Las siglas CRISPR nombran las secuencias repetidas del ADN; Cas, las enzimas que cortan.</text>
<text x="560.0" y="402.0" font-size="13" text-anchor="middle" font-weight="900" fill="#0f4c81" >Aplicaciones: terapia génica (anemia falciforme), modelos animales de enfermedades, mejora de cultivos, investigación básica.</text>
</svg>
