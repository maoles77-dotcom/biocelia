<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Obtención de ADN complementario con la transcriptasa inversa</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<text x="450.0" y="30.0" font-size="15" text-anchor="middle" font-weight="900" fill="#0f4c81" >TRANSCRIPTASA INVERSA: de ARNm a ADN complementario (ADNc)</text>
<text x="20.0" y="86.0" font-size="13" text-anchor="start" font-weight="900" fill="#22313f" >Gen eucariota</text>
<rect x="150" y="66" width="70" height="28" rx="5" fill="#0f4c81"/><text x="185.0" y="85.0" font-size="11.5" text-anchor="middle" font-weight="900" fill="#fff" >exón</text>
<rect x="220" y="66" width="60" height="28" rx="5" fill="#c7cdd3"/><text x="250.0" y="85.0" font-size="11.5" text-anchor="middle" font-weight="900" fill="#4c5b67" >intrón</text>
<rect x="280" y="66" width="90" height="28" rx="5" fill="#0f4c81"/><text x="325.0" y="85.0" font-size="11.5" text-anchor="middle" font-weight="900" fill="#fff" >exón</text>
<rect x="370" y="66" width="70" height="28" rx="5" fill="#c7cdd3"/><text x="405.0" y="85.0" font-size="11.5" text-anchor="middle" font-weight="900" fill="#4c5b67" >intrón</text>
<rect x="440" y="66" width="60" height="28" rx="5" fill="#0f4c81"/><text x="470.0" y="85.0" font-size="11.5" text-anchor="middle" font-weight="900" fill="#fff" >exón</text>
<line x1="300.0" y1="104.0" x2="300.0" y2="140.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><text x="312.0" y="128.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >transcripción y maduración (en la célula)</text>
<text x="20.0" y="172.0" font-size="13" text-anchor="start" font-weight="900" fill="#22313f" >ARNm maduro</text>
<rect x="220" y="154" width="70" height="24" rx="5" fill="#c77d00"/><rect x="290" y="154" width="90" height="24" rx="5" fill="#c77d00"/><rect x="380" y="154" width="60" height="24" rx="5" fill="#c77d00"/><text x="560.0" y="171.0" font-size="13" text-anchor="start" font-weight="900" fill="#c77d00" >sin intrones</text>
<line x1="330.0" y1="186.0" x2="330.0" y2="222.0" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><text x="342.0" y="210.0" font-size="13" text-anchor="start" font-weight="900" fill="#c0392b" >transcriptasa inversa (de retrovirus)</text>
<text x="20.0" y="252.0" font-size="13" text-anchor="start" font-weight="900" fill="#22313f" >ADNc</text>
<rect x="220" y="234" width="70" height="24" rx="5" fill="#6d3fc0"/><rect x="290" y="234" width="90" height="24" rx="5" fill="#6d3fc0"/><rect x="380" y="234" width="60" height="24" rx="5" fill="#6d3fc0"/><text x="560.0" y="251.0" font-size="13" text-anchor="start" font-weight="900" fill="#6d3fc0" >ADN copia del gen, sin intrones</text>
<text x="450.0" y="300.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#0f4c81" >Las bacterias no pueden eliminar intrones: con el ADNc pueden fabricar la proteína eucariota (insulina).</text>
</svg>
