<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 580" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Obtención de insulina humana mediante ADN recombinante</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<circle cx="40" cy="60" r="15" fill="#0f4c81"/><text x="40.0" y="65.0" font-size="14" text-anchor="middle" font-weight="900" fill="#fff" >1</text>
<rect x="70" y="40" width="220" height="40" rx="8" fill="#fff" stroke="#4c5b67" stroke-width="2"/><rect x="140" y="44" width="80" height="32" rx="6" fill="#c0392b"/><text x="180.0" y="66.0" font-size="14" text-anchor="middle" font-weight="900" fill="#fff" >gen</text>
<text x="180.0" y="106.0" font-size="13" text-anchor="middle" font-weight="800" fill="#22313f" >ADN humano: se aísla el gen de la insulina</text>
<text x="180.0" y="124.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >(o ADNc obtenido con transcriptasa inversa)</text>
<circle cx="40" cy="200" r="15" fill="#0f4c81"/><text x="40.0" y="205.0" font-size="14" text-anchor="middle" font-weight="900" fill="#fff" >1</text>
<circle cx="180" cy="220" r="52" fill="none" stroke="#0f4c81" stroke-width="7"/><path d="M146.6,259.8 A52,52 0 0 1 128.8,229.0" fill="none" stroke="#3f8a3a" stroke-width="9"/><text x="180.0" y="226.0" font-size="13" text-anchor="middle" font-weight="900" fill="#0f4c81" >plásmido</text>
<text x="180.0" y="300.0" font-size="12" text-anchor="middle" font-weight="900" fill="#3f8a3a" >vector con gen de resistencia</text>
<text x="180.0" y="316.0" font-size="12" text-anchor="middle" font-weight="900" fill="#3f8a3a" >a un antibiótico (marcador)</text>
<line x1="300.0" y1="64.0" x2="395.0" y2="140.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><line x1="250.0" y1="220.0" x2="380.0" y2="200.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><circle cx="440" cy="60" r="15" fill="#0f4c81"/><text x="440.0" y="65.0" font-size="14" text-anchor="middle" font-weight="900" fill="#fff" >2</text>
<text x="440.0" y="100.0" font-size="13" text-anchor="middle" font-weight="900" fill="#22313f" >Corte con la misma</text>
<text x="440.0" y="118.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c0392b" >enzima de restricción</text>
<rect x="400" y="140" width="80" height="26" rx="6" fill="#c0392b"/><text x="440.0" y="158.0" font-size="12" text-anchor="middle" font-weight="900" fill="#fff" >inserto</text>
<path d="M483.0,249.1 A44,44 0 1 1 483.0,230.9" fill="none" stroke="#0f4c81" stroke-width="7"/><path d="M411.7,273.7 A44,44 0 0 1 396.7,247.6" fill="none" stroke="#3f8a3a" stroke-width="9"/><text x="440.0" y="314.0" font-size="12" text-anchor="middle" font-weight="900" fill="#6d3fc0" >extremos cohesivos</text>
<line x1="500.0" y1="200.0" x2="590.0" y2="200.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><circle cx="660" cy="60" r="15" fill="#0f4c81"/><text x="660.0" y="65.0" font-size="14" text-anchor="middle" font-weight="900" fill="#fff" >3</text>
<text x="660.0" y="100.0" font-size="13" text-anchor="middle" font-weight="900" fill="#22313f" >Unión con</text>
<text x="660.0" y="118.0" font-size="13" text-anchor="middle" font-weight="900" fill="#0f4c81" >ADN ligasa</text>
<path d="M710.9,230.8 A52,52 0 1 1 710.9,209.2" fill="none" stroke="#0f4c81" stroke-width="7"/><path d="M710.9,209.2 A52,52 0 0 1 710.9,230.8" fill="none" stroke="#c0392b" stroke-width="9"/><path d="M626.6,259.8 A52,52 0 0 1 608.8,229.0" fill="none" stroke="#3f8a3a" stroke-width="9"/><text x="660.0" y="300.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c0392b" >ADN RECOMBINANTE</text>
<line x1="730.0" y1="220.0" x2="800.0" y2="220.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><circle cx="880" cy="60" r="15" fill="#0f4c81"/><text x="880.0" y="65.0" font-size="14" text-anchor="middle" font-weight="900" fill="#fff" >4</text>
<text x="880.0" y="100.0" font-size="13" text-anchor="middle" font-weight="900" fill="#22313f" >Se introduce en</text>
<text x="880.0" y="118.0" font-size="13" text-anchor="middle" font-weight="900" fill="#2a9d8f" >la bacteria (E. coli)</text>
<rect x="810" y="170" width="150" height="100" rx="50" fill="#dff3ef" stroke="#2a9d8f" stroke-width="3"/><path d="M840,215 q15,-25 35,0 t35,0" fill="none" stroke="#22313f" stroke-width="2.5"/><path d="M935.7,243.3 A16,16 0 1 1 935.7,236.7" fill="none" stroke="#0f4c81" stroke-width="7"/><path d="M935.7,236.7 A16,16 0 0 1 935.7,243.3" fill="none" stroke="#c0392b" stroke-width="9"/><text x="885.0" y="300.0" font-size="12" text-anchor="middle" font-weight="900" fill="#2a9d8f" >bacteria transformada</text>
<line x1="885.0" y1="330.0" x2="885.0" y2="380.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><circle cx="990" cy="395" r="15" fill="#0f4c81"/><text x="990.0" y="400.0" font-size="14" text-anchor="middle" font-weight="900" fill="#fff" >5</text>
<ellipse cx="885" cy="430" rx="80" ry="34" fill="#fff4df" stroke="#c77d00" stroke-width="2.5"/><circle cx="845" cy="422" r="7" fill="#2a9d8f"/><circle cx="885" cy="440" r="7" fill="#2a9d8f"/><circle cx="915" cy="418" r="7" fill="#2a9d8f"/><circle cx="935" cy="438" r="7" fill="#2a9d8f"/><circle cx="865" cy="444" r="7" fill="#2a9d8f"/><text x="885.0" y="490.0" font-size="12.5" text-anchor="middle" font-weight="900" fill="#22313f" >Selección: medio con antibiótico;</text>
<text x="885.0" y="506.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >solo crecen las que tienen el plásmido</text>
<line x1="800.0" y1="430.0" x2="640.0" y2="430.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><circle cx="560" cy="370" r="15" fill="#0f4c81"/><text x="560.0" y="375.0" font-size="14" text-anchor="middle" font-weight="900" fill="#fff" >6</text>
<rect x="490" y="390" width="140" height="90" rx="20" fill="#fbe9c8" stroke="#22313f" stroke-width="3"/><rect x="511" y="431" width="18" height="8" rx="4" fill="#2a9d8f"/><rect x="551" y="451" width="18" height="8" rx="4" fill="#2a9d8f"/><rect x="581" y="421" width="18" height="8" rx="4" fill="#2a9d8f"/><rect x="536" y="411" width="18" height="8" rx="4" fill="#2a9d8f"/><rect x="591" y="456" width="18" height="8" rx="4" fill="#2a9d8f"/><text x="560.0" y="500.0" font-size="12.5" text-anchor="middle" font-weight="900" fill="#22313f" >Cultivo en fermentador:</text>
<text x="560.0" y="516.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >la bacteria transcribe y traduce el gen</text>
<line x1="480.0" y1="430.0" x2="360.0" y2="430.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><rect x="165.0" y="402.0" width="190" height="56" rx="12" fill="#fdeaea" stroke="#c0392b" stroke-width="2.5"/><text x="260.0" y="427.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c0392b" >INSULINA HUMANA</text>
<text x="260.0" y="445.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >se extrae y purifica</text>
<text x="500.0" y="560.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#0f4c81" >Funciona porque el código genético es universal: la bacteria «lee» el gen humano igual que lo haría una célula humana.</text>
</svg>
