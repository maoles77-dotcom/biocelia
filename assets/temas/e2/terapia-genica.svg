<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 400" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Terapia génica ex vivo e in vivo</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<text x="530.0" y="30.0" font-size="15" text-anchor="middle" font-weight="900" fill="#0f4c81" >TERAPIA GÉNICA: introducir, corregir o sustituir genes para tratar una enfermedad</text>
<rect x="20" y="56" width="500" height="300" rx="16" fill="#fff" stroke="#2a9d8f" stroke-width="2.5"/><text x="270.0" y="86.0" font-size="16" text-anchor="middle" font-weight="900" fill="#2a9d8f" >EX VIVO (fuera del cuerpo)</text>
<rect x="35.0" y="123.0" width="150" height="54" rx="12" fill="#f4f7fa" stroke="#22313f" stroke-width="2.5"/><text x="110.0" y="147.0" font-size="13" text-anchor="middle" font-weight="900" fill="#22313f" >1 · Se extraen</text>
<text x="110.0" y="165.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >células del paciente</text>
<line x1="186.0" y1="150.0" x2="254.0" y2="150.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><rect x="260.0" y="123.0" width="160" height="54" rx="12" fill="#f4f7fa" stroke="#22313f" stroke-width="2.5"/><text x="340.0" y="147.0" font-size="13" text-anchor="middle" font-weight="900" fill="#22313f" >2 · Se les añade</text>
<text x="340.0" y="165.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >el gen sano (vector)</text>
<line x1="340.0" y1="178.0" x2="340.0" y2="230.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><rect x="260.0" y="233.0" width="160" height="54" rx="12" fill="#f4f7fa" stroke="#22313f" stroke-width="2.5"/><text x="340.0" y="257.0" font-size="13" text-anchor="middle" font-weight="900" fill="#22313f" >3 · Se cultivan</text>
<text x="340.0" y="275.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >y se seleccionan</text>
<line x1="258.0" y1="260.0" x2="190.0" y2="260.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><rect x="35.0" y="233.0" width="150" height="54" rx="12" fill="#f4f7fa" stroke="#22313f" stroke-width="2.5"/><text x="110.0" y="257.0" font-size="13" text-anchor="middle" font-weight="900" fill="#22313f" >4 · Se reinyectan</text>
<text x="110.0" y="275.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >al paciente</text>
<text x="270.0" y="330.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >Ej.: células madre de la sangre (inmunodeficiencias,</text>
<text x="270.0" y="346.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >anemia falciforme); linfocitos CAR-T contra el cáncer</text>
<rect x="540" y="56" width="500" height="300" rx="16" fill="#fff" stroke="#6d3fc0" stroke-width="2.5"/><text x="790.0" y="86.0" font-size="16" text-anchor="middle" font-weight="900" fill="#6d3fc0" >IN VIVO (dentro del cuerpo)</text>
<polygon points="679.4,217.0 650.0,234.0 620.6,217.0 620.6,183.0 650.0,166.0 679.4,183.0" fill="#efe7fb" stroke="#6d3fc0" stroke-width="3"/><path d="M634,200 q8,-12 16,0 t16,0" fill="none" stroke="#c0392b" stroke-width="3"/><text x="650.0" y="258.0" font-size="12.5" text-anchor="middle" font-weight="900" fill="#6d3fc0" >virus modificado</text>
<text x="650.0" y="274.0" font-size="12.5" text-anchor="middle" font-weight="900" fill="#c0392b" >con el gen sano</text>
<line x1="700.0" y1="200.0" x2="800.0" y2="200.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><ellipse cx="900" cy="200" rx="90" ry="60" fill="#fdf3e7" stroke="#c77d00" stroke-width="3"/><circle cx="890" cy="200" r="24" fill="#c9b7ef" stroke="#6d3fc0" stroke-width="2"/><path d="M878,200 q6,-8 12,0 t12,0" fill="none" stroke="#c0392b" stroke-width="3"/><text x="900.0" y="282.0" font-size="12.5" text-anchor="middle" font-weight="900" fill="#c77d00" >célula del tejido enfermo</text>
<text x="790.0" y="330.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >Ej.: ceguera hereditaria (retina), atrofia muscular</text>
<text x="790.0" y="346.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >espinal: el vector se inyecta en el órgano o en la sangre</text>
<text x="530.0" y="386.0" font-size="13" text-anchor="middle" font-weight="900" fill="#0f4c81" >Se modifican células somáticas: el cambio no pasa a la descendencia (la línea germinal no se puede modificar en España). Vectores: virus no patógenos, liposomas.</text>
</svg>
