<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Agentes mutagénicos físicos, químicos y biológicos; dímero de timina</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="20" y="20" width="320" height="240" rx="18" fill="#e3eef8" stroke="#0f4c81" stroke-width="2.5"/><text x="180.0" y="56.0" font-size="22" text-anchor="middle" font-weight="900" fill="#0f4c81" >Físicos</text>
<text x="44.0" y="92.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Radiación UV</text>
<text x="44.0" y="116.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Rayos X y γ (ionizantes)</text>
<text x="180.0" y="212.0" font-size="13" text-anchor="middle" font-weight="900" fill="#0f4c81" >UV: dímeros de timina</text>
<text x="180.0" y="232.0" font-size="13" text-anchor="middle" font-weight="900" fill="#0f4c81" >Ionizantes: roturas del ADN</text>
<rect x="360" y="20" width="320" height="240" rx="18" fill="#fff4df" stroke="#c77d00" stroke-width="2.5"/><text x="520.0" y="56.0" font-size="22" text-anchor="middle" font-weight="900" fill="#c77d00" >Químicos</text>
<text x="384.0" y="92.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• 5-bromouracilo (análogo de base)</text>
<text x="384.0" y="116.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Ácido nitroso</text>
<text x="384.0" y="140.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Agentes alquilantes, acridinas</text>
<text x="384.0" y="164.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Benzopireno (humo del tabaco)</text>
<text x="520.0" y="212.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c77d00" >Cambian o sustituyen bases,</text>
<text x="520.0" y="232.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c77d00" >o se intercalan en el ADN</text>
<rect x="700" y="20" width="320" height="240" rx="18" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2.5"/><text x="860.0" y="56.0" font-size="22" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Biológicos</text>
<text x="724.0" y="92.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Virus (p. ej., VPH)</text>
<text x="724.0" y="116.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Transposones (elementos</text>
<text x="724.0" y="140.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >  genéticos móviles)</text>
<text x="860.0" y="212.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Insertan su ADN en el</text>
<text x="860.0" y="232.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >genoma y alteran genes</text>
<text x="20.0" y="300.0" font-size="15" text-anchor="start" font-weight="900" fill="#0f4c81" >Ejemplo: la radiación UV une dos timinas contiguas de la misma hebra (dímero de timina)</text>
<line x1="120.0" y1="330.0" x2="120.0" y2="364.0" stroke="#5b8fc7" stroke-width="6" stroke-linecap="round" /><text x="120.0" y="408.0" font-size="18" text-anchor="middle" font-weight="900" fill="#22313f" font-family="Consolas, monospace">A</text>
<line x1="180.0" y1="330.0" x2="180.0" y2="364.0" stroke="#5b8fc7" stroke-width="6" stroke-linecap="round" /><text x="180.0" y="408.0" font-size="18" text-anchor="middle" font-weight="900" fill="#22313f" font-family="Consolas, monospace">C</text>
<line x1="240.0" y1="330.0" x2="240.0" y2="364.0" stroke="#5b8fc7" stroke-width="6" stroke-linecap="round" /><text x="240.0" y="408.0" font-size="18" text-anchor="middle" font-weight="900" fill="#c0392b" font-family="Consolas, monospace">T</text>
<line x1="300.0" y1="330.0" x2="300.0" y2="364.0" stroke="#5b8fc7" stroke-width="6" stroke-linecap="round" /><text x="300.0" y="408.0" font-size="18" text-anchor="middle" font-weight="900" fill="#c0392b" font-family="Consolas, monospace">T</text>
<line x1="360.0" y1="330.0" x2="360.0" y2="364.0" stroke="#5b8fc7" stroke-width="6" stroke-linecap="round" /><text x="360.0" y="408.0" font-size="18" text-anchor="middle" font-weight="900" fill="#22313f" font-family="Consolas, monospace">G</text>
<line x1="420.0" y1="330.0" x2="420.0" y2="364.0" stroke="#5b8fc7" stroke-width="6" stroke-linecap="round" /><text x="420.0" y="408.0" font-size="18" text-anchor="middle" font-weight="900" fill="#22313f" font-family="Consolas, monospace">A</text>
<line x1="480.0" y1="330.0" x2="480.0" y2="364.0" stroke="#5b8fc7" stroke-width="6" stroke-linecap="round" /><text x="480.0" y="408.0" font-size="18" text-anchor="middle" font-weight="900" fill="#22313f" font-family="Consolas, monospace">G</text>
<line x1="540.0" y1="330.0" x2="540.0" y2="364.0" stroke="#5b8fc7" stroke-width="6" stroke-linecap="round" /><text x="540.0" y="408.0" font-size="18" text-anchor="middle" font-weight="900" fill="#22313f" font-family="Consolas, monospace">C</text>
<line x1="100.0" y1="330.0" x2="560.0" y2="330.0" stroke="#1f5f99" stroke-width="6" stroke-linecap="round" /><path d="M240,362 C240,386 300,386 300,362" fill="none" stroke="#c0392b" stroke-width="4"/><line x1="640.0" y1="320.0" x2="660.0" y2="360.0" stroke="#b388eb" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="660.0" y1="320.0" x2="680.0" y2="360.0" stroke="#b388eb" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="680.0" y1="320.0" x2="700.0" y2="360.0" stroke="#b388eb" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="700.0" y1="320.0" x2="720.0" y2="360.0" stroke="#b388eb" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><text x="700.0" y="388.0" font-size="22" text-anchor="middle" font-weight="900" fill="#6d3fc0" >UV</text>
<text x="820.0" y="350.0" font-size="14" text-anchor="start" font-weight="800" fill="#4c5b67" >deforma la doble hélice:</text>
<text x="820.0" y="370.0" font-size="14" text-anchor="start" font-weight="800" fill="#4c5b67" >errores al replicar</text>
</svg>
