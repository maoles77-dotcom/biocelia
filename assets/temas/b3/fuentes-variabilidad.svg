<text x="780.0" y="276.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c77d00" >En la especie humana (n = 23): 2²³ ≈ 8,4 millones</text>
<text x="780.0" y="310.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >rojo = cromosoma de origen materno · verde = paterno</text>
<text x="530.0" y="372.0" font-size="16" text-anchor="middle" font-weight="900" fill="#c0392b" >+ Mutación (nuevos alelos) + Fecundación (unión al azar de gametos) = VARIABILIDAD GENÉTICA</text>
</svg>
