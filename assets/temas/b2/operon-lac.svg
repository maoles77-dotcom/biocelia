<line x1="612.0" y1="470.0" x2="680.0" y2="470.0" stroke="#3f8a3a" stroke-width="3" stroke-linecap="round" marker-end="url(#fk)"/><line x1="444.0" y1="590.0" x2="1000.0" y2="590.0" stroke="#8e44ad" stroke-width="6" stroke-linecap="round" /><text x="436.0" y="595.0" font-size="14" text-anchor="end" font-weight="900" fill="#8e44ad" >5'</text>
