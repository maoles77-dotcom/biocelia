<circle cx="344" cy="412" r="11" fill="#f4a261" stroke="#b5651d" stroke-width="2"/><text x="400.0" y="404.0" font-size="13" text-anchor="start" font-weight="900" fill="#b5651d" >inductor (alolactosa):</text>
