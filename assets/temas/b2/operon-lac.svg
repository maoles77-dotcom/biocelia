<rect x="10" y="10" width="1060" height="290" rx="18" fill="#f6f9fb" stroke="#d5dde3"/><text x="30.0" y="44.0" font-size="20" text-anchor="start" font-weight="900" fill="#0f4c81" >A · Sin lactosa: operón reprimido (apagado)</text>
