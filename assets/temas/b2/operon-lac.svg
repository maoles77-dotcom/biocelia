<text x="560.0" y="110.0" font-size="15" text-anchor="start" font-weight="900" fill="#c0392b" >El represor se une al operador:</text>
<text x="560.0" y="132.0" font-size="15" text-anchor="start" font-weight="800" fill="#c0392b" >la ARN polimerasa no puede transcribir</text>
<text x="560.0" y="154.0" font-size="15" text-anchor="start" font-weight="800" fill="#c0392b" >→ no se fabrican las enzimas</text>
