<line x1="721.0" y1="554.0" x2="721.0" y2="564.0" stroke="#8e44ad" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><line x1="554.0" y1="598.0" x2="554.0" y2="634.0" stroke="#4c5b67" stroke-width="2" stroke-linecap="round" marker-end="url(#fk)"/><rect x="474" y="640" width="160" height="50" rx="12" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2"/><text x="554.0" y="662.0" font-size="14" text-anchor="middle" font-weight="900" fill="#3f8a3a" >β-galactosidasa</text>
<text x="554.0" y="680.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >hidroliza la lactosa</text>
<line x1="756.0" y1="598.0" x2="756.0" y2="634.0" stroke="#4c5b67" stroke-width="2" stroke-linecap="round" marker-end="url(#fk)"/><rect x="676" y="640" width="160" height="50" rx="12" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2"/><text x="756.0" y="662.0" font-size="14" text-anchor="middle" font-weight="900" fill="#3f8a3a" >permeasa</text>
