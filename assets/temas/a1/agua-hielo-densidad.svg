<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 325" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>El hielo flota y protege la vida acuática</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<defs><linearGradient id="lago" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9def5"/><stop offset="1" stop-color="#2f6f9f"/></linearGradient></defs><rect x="0" y="0" width="520" height="70" fill="#eef5fb"/><path d="M0,70 L520,70 L520,300 L0,300 z" fill="url(#lago)"/><rect x="0" y="62" width="520" height="30" fill="#f4fbff" stroke="#9cc7e3" stroke-width="2"/><text x="260.0" y="82.0" font-size="14" text-anchor="middle" font-weight="800" fill="#22313f" >Hielo (0 °C): menos denso, flota y aísla del frío exterior</text>
<text x="260.0" y="40.0" font-size="14" text-anchor="middle" font-weight="700" fill="#4c5b67" >Aire a −30 °C</text>
<text x="440.0" y="140.0" font-size="13" text-anchor="middle" font-weight="800" fill="#123" >0 – 4 °C</text>
<text x="440.0" y="275.0" font-size="15" text-anchor="middle" font-weight="800" fill="#fff" >4 °C</text>
<text x="440.0" y="292.0" font-size="12" text-anchor="middle" font-weight="700" fill="#fff" >máxima densidad</text>
<g transform="translate(120,180) scale(1,1)"><path d="M-22,0 q22,-16 44,0 q-22,16 -44,0z" fill="#f2a541" stroke="#a8641a"/><path d="M22,0 l14,-10 v20z" fill="#f2a541" stroke="#a8641a"/><circle cx="-12" cy="-2" r="2.2" fill="#222"/></g><g transform="translate(230,240) scale(-1,1)"><path d="M-22,0 q22,-16 44,0 q-22,16 -44,0z" fill="#f2a541" stroke="#a8641a"/><path d="M22,0 l14,-10 v20z" fill="#f2a541" stroke="#a8641a"/><circle cx="-12" cy="-2" r="2.2" fill="#222"/></g><g transform="translate(330,200) scale(1,1)"><path d="M-22,0 q22,-16 44,0 q-22,16 -44,0z" fill="#f2a541" stroke="#a8641a"/><path d="M22,0 l14,-10 v20z" fill="#f2a541" stroke="#a8641a"/><circle cx="-12" cy="-2" r="2.2" fill="#222"/></g><text x="200.0" y="316.0" font-size="13" text-anchor="middle" font-weight="600" fill="#4c5b67" >El agua líquida sigue bajo el hielo y la vida acuática se mantiene.</text>
</svg>
