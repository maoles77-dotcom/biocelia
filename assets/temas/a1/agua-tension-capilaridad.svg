<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Tensión superficial y capilaridad del agua</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<text x="150.0" y="26.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >Tensión superficial (cohesión)</text>
<rect x="20" y="120" width="260" height="150" rx="6" fill="#a9d4f2"/><line x1="20" y1="120" x2="280" y2="120" stroke="#2a7fc1" stroke-width="3"/><ellipse cx="150" cy="96" rx="26" ry="8" fill="#5b4636"/><path d="M138,98 Q126,78 110,118" fill="none" stroke="#5b4636" stroke-width="2.4"/><path d="M103,120 q7,6 14,0" fill="none" stroke="#2a7fc1" stroke-width="1.5"/><path d="M138,98 Q112,75 88,118" fill="none" stroke="#5b4636" stroke-width="2.4"/><path d="M81,120 q7,6 14,0" fill="none" stroke="#2a7fc1" stroke-width="1.5"/><path d="M138,98 Q98,72 66,118" fill="none" stroke="#5b4636" stroke-width="2.4"/><path d="M59,120 q7,6 14,0" fill="none" stroke="#2a7fc1" stroke-width="1.5"/><path d="M162,98 Q174,78 190,118" fill="none" stroke="#5b4636" stroke-width="2.4"/><path d="M183,120 q7,6 14,0" fill="none" stroke="#2a7fc1" stroke-width="1.5"/><path d="M162,98 Q188,75 212,118" fill="none" stroke="#5b4636" stroke-width="2.4"/><path d="M205,120 q7,6 14,0" fill="none" stroke="#2a7fc1" stroke-width="1.5"/><path d="M162,98 Q202,72 234,118" fill="none" stroke="#5b4636" stroke-width="2.4"/><path d="M227,120 q7,6 14,0" fill="none" stroke="#2a7fc1" stroke-width="1.5"/><circle cx="50" cy="132" r="7" fill="url(#gO)" stroke="#9e2a26"/><circle cx="90" cy="132" r="7" fill="url(#gO)" stroke="#9e2a26"/><circle cx="130" cy="132" r="7" fill="url(#gO)" stroke="#9e2a26"/><circle cx="170" cy="132" r="7" fill="url(#gO)" stroke="#9e2a26"/><circle cx="210" cy="132" r="7" fill="url(#gO)" stroke="#9e2a26"/><circle cx="250" cy="132" r="7" fill="url(#gO)" stroke="#9e2a26"/><line x1="90" y1="141" x2="90" y2="160" stroke="#22313f" stroke-width="1.6" marker-end="url(#fk)"/><line x1="130" y1="141" x2="130" y2="160" stroke="#22313f" stroke-width="1.6" marker-end="url(#fk)"/><line x1="170" y1="141" x2="170" y2="160" stroke="#22313f" stroke-width="1.6" marker-end="url(#fk)"/><line x1="210" y1="141" x2="210" y2="160" stroke="#22313f" stroke-width="1.6" marker-end="url(#fk)"/><circle cx="130" cy="215" r="7" fill="url(#gO)" stroke="#9e2a26"/><line x1="140.0" y1="215.0" x2="156.0" y2="215.0" stroke="#22313f" stroke-width="1.6" marker-end="url(#fk)"/><line x1="135.0" y1="223.7" x2="143.0" y2="237.5" stroke="#22313f" stroke-width="1.6" marker-end="url(#fk)"/><line x1="125.0" y1="223.7" x2="117.0" y2="237.5" stroke="#22313f" stroke-width="1.6" marker-end="url(#fk)"/><line x1="120.0" y1="215.0" x2="104.0" y2="215.0" stroke="#22313f" stroke-width="1.6" marker-end="url(#fk)"/><line x1="125.0" y1="206.3" x2="117.0" y2="192.5" stroke="#22313f" stroke-width="1.6" marker-end="url(#fk)"/><line x1="135.0" y1="206.3" x2="143.0" y2="192.5" stroke="#22313f" stroke-width="1.6" marker-end="url(#fk)"/><text x="150.0" y="290.0" font-size="12" text-anchor="middle" font-weight="600" fill="#4c5b67" >En la superficie la atracción neta va hacia el interior:</text>
<text x="150.0" y="306.0" font-size="12" text-anchor="middle" font-weight="600" fill="#4c5b67" >la superficie resiste ser atravesada.</text>
<text x="490.0" y="26.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >Capilaridad (cohesión + adhesión)</text>
<rect x="400" y="190" width="230" height="80" rx="6" fill="#a9d4f2"/><line x1="400" y1="190" x2="630" y2="190" stroke="#2a7fc1" stroke-width="3"/><rect x="433.0" y="70" width="14" height="180" fill="#a9d4f2"/><path d="M433.0,69 q7.0,6.3 14,0 z" fill="#ffffff"/><path d="M433.0,70 q7.0,6.3 14,0" fill="none" stroke="#2a7fc1" stroke-width="2"/><line x1="431.0" y1="50" x2="431.0" y2="250" stroke="#7b8a97" stroke-width="3"/><line x1="449.0" y1="50" x2="449.0" y2="250" stroke="#7b8a97" stroke-width="3"/><rect x="492.0" y="130" width="26" height="120" fill="#a9d4f2"/><path d="M492.0,129 q13.0,11.700000000000001 26,0 z" fill="#ffffff"/><path d="M492.0,130 q13.0,11.700000000000001 26,0" fill="none" stroke="#2a7fc1" stroke-width="2"/><line x1="490.0" y1="50" x2="490.0" y2="250" stroke="#7b8a97" stroke-width="3"/><line x1="520.0" y1="50" x2="520.0" y2="250" stroke="#7b8a97" stroke-width="3"/><rect x="555.0" y="165" width="40" height="85" fill="#a9d4f2"/><path d="M555.0,164 q20.0,18.0 40,0 z" fill="#ffffff"/><path d="M555.0,165 q20.0,18.0 40,0" fill="none" stroke="#2a7fc1" stroke-width="2"/><line x1="553.0" y1="50" x2="553.0" y2="250" stroke="#7b8a97" stroke-width="3"/><line x1="597.0" y1="50" x2="597.0" y2="250" stroke="#7b8a97" stroke-width="3"/><line x1="398" y1="88" x2="429" y2="80" stroke="#22313f" stroke-width="1.4" marker-end="url(#fk)"/><text x="394.0" y="80.0" font-size="12" text-anchor="end" font-weight="700" fill="#22313f" >adhesión</text>
<text x="394.0" y="95.0" font-size="12" text-anchor="end" font-weight="700" fill="#22313f" >a la pared</text>
<text x="505.0" y="290.0" font-size="11.5" text-anchor="middle" font-weight="600" fill="#4c5b67" >Cuanto más estrecho es el tubo, más asciende el agua</text>
<text x="505.0" y="306.0" font-size="12" text-anchor="middle" font-weight="600" fill="#4c5b67" >(ascenso de la savia bruta por el xilema).</text>
</svg>
