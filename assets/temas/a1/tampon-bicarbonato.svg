<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Funcionamiento del tampón bicarbonato cuando sobra o falta ácido</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<text x="20.0" y="30.0" font-size="18" text-anchor="start" font-weight="900" fill="#c0392b" >Si sobra ácido (H⁺):</text>
<rect x="55.0" y="59" width="50" height="44" rx="12" fill="#fbeae8"/><text x="80.0" y="89.0" font-size="20" text-anchor="middle" font-weight="900" fill="#c0392b" >H⁺</text>
<text x="140.0" y="91.0" font-size="26" text-anchor="middle" font-weight="900" fill="#22313f" >+</text>
<rect x="175.5" y="59" width="89" height="44" rx="12" fill="#e7f0f8"/><text x="220.0" y="89.0" font-size="20" text-anchor="middle" font-weight="900" fill="#0f4c81" >HCO₃⁻</text>
<line x1="285" y1="85" x2="340" y2="85" stroke="#22313f" stroke-width="3" marker-end="url(#fk)"/><rect x="365.5" y="59" width="89" height="44" rx="12" fill="#e7f0f8"/><text x="410.0" y="89.0" font-size="20" text-anchor="middle" font-weight="900" fill="#0f4c81" >H₂CO₃</text>
<line x1="475" y1="85" x2="530" y2="85" stroke="#22313f" stroke-width="3" marker-end="url(#fk)"/><rect x="545.0" y="59" width="160" height="44" rx="12" fill="#e7f0f8"/><text x="625.0" y="89.0" font-size="20" text-anchor="middle" font-weight="900" fill="#0f4c81" >CO₂ + H₂O</text>
<line x1="710" y1="85" x2="770" y2="85" stroke="#22313f" stroke-width="3" marker-end="url(#fk)"/><path d="M840,50 V75" stroke="#c0607a" stroke-width="6"/><path d="M840,75 L815,90 M840,75 L865,90" stroke="#c0607a" stroke-width="5"/><path d="M812,80 C780,85 775,140 800,145 C820,148 828,120 826,95z" fill="#f5b3c3" stroke="#c0607a" stroke-width="2.5"/><path d="M868,80 C900,85 905,140 880,145 C860,148 852,120 854,95z" fill="#f5b3c3" stroke="#c0607a" stroke-width="2.5"/><text x="900.0" y="170.0" font-size="14" text-anchor="end" font-weight="800" fill="#4c5b67" >el CO₂ se expulsa al respirar</text>
<text x="20.0" y="215.0" font-size="18" text-anchor="start" font-weight="900" fill="#5e3c99" >Si falta ácido (medio básico):</text>
<rect x="85.5" y="239" width="89" height="44" rx="12" fill="#e7f0f8"/><text x="130.0" y="269.0" font-size="20" text-anchor="middle" font-weight="900" fill="#0f4c81" >H₂CO₃</text>
<line x1="195" y1="265" x2="250" y2="265" stroke="#22313f" stroke-width="3" marker-end="url(#fk)"/><rect x="275.5" y="239" width="89" height="44" rx="12" fill="#e7f0f8"/><text x="320.0" y="269.0" font-size="20" text-anchor="middle" font-weight="900" fill="#0f4c81" >HCO₃⁻</text>
<text x="385.0" y="271.0" font-size="26" text-anchor="middle" font-weight="900" fill="#22313f" >+</text>
<rect x="415.0" y="239" width="50" height="44" rx="12" fill="#fbeae8"/><text x="440.0" y="269.0" font-size="20" text-anchor="middle" font-weight="900" fill="#c0392b" >H⁺</text>
<text x="500.0" y="271.0" font-size="17" text-anchor="start" font-weight="800" fill="#4c5b67" >→ se liberan H⁺ y el pH vuelve a bajar</text>
</svg>
