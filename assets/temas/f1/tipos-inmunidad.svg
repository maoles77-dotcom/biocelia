<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Tipos de inmunidad adquirida: activa y pasiva, natural y artificial</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<text x="40.0" y="70.0" font-size="13" text-anchor="middle" font-weight="800" fill="#22313f" ></text>
<rect x="180.0" y="14.0" width="300" height="40" rx="12" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2.5"/><text x="330.0" y="38.9" font-size="14" text-anchor="middle" font-weight="900" fill="#3f8a3a" >ACTIVA: el organismo fabrica</text>
<rect x="570.0" y="14.0" width="300" height="40" rx="12" fill="#fff4df" stroke="#c77d00" stroke-width="2.5"/><text x="720.0" y="38.9" font-size="14" text-anchor="middle" font-weight="900" fill="#c77d00" >PASIVA: recibe anticuerpos hechos</text>
<text x="90.0" y="128.0" font-size="16" text-anchor="middle" font-weight="900" fill="#0f4c81" >NATURAL</text>
<text x="90.0" y="274.0" font-size="16" text-anchor="middle" font-weight="900" fill="#6d3fc0" >ARTIFICIAL</text>
<rect x="150" y="74" width="360" height="112" rx="14" fill="#fff" stroke="#3f8a3a" stroke-width="2.5"/><text x="330.0" y="116.0" font-size="17" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Pasar la infección</text>
<text x="330.0" y="140.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >linfocitos propios</text>
<rect x="540" y="74" width="360" height="112" rx="14" fill="#fff" stroke="#c77d00" stroke-width="2.5"/><text x="720.0" y="116.0" font-size="17" text-anchor="middle" font-weight="900" fill="#c77d00" >Anticuerpos de la madre</text>
<text x="720.0" y="140.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >IgG por la placenta; IgA en la leche</text>
<rect x="150" y="220" width="360" height="112" rx="14" fill="#fff" stroke="#3f8a3a" stroke-width="2.5"/><text x="330.0" y="262.0" font-size="17" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Vacunación</text>
<text x="330.0" y="286.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >antígenos del patógeno</text>
<rect x="540" y="220" width="360" height="112" rx="14" fill="#fff" stroke="#c77d00" stroke-width="2.5"/><text x="720.0" y="262.0" font-size="17" text-anchor="middle" font-weight="900" fill="#c77d00" >Sueroterapia</text>
<text x="720.0" y="286.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >anticuerpos de otra persona o animal</text>
<text x="330.0" y="162.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >memoria · duradera</text>
<text x="720.0" y="162.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c77d00" >sin memoria · temporal</text>
<text x="330.0" y="308.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >PREVENTIVA · memoria · tarda en actuar</text>
<text x="720.0" y="308.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c77d00" >CURATIVA · inmediata · dura poco</text>
