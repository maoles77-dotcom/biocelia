<text x="790.0" y="172.0" font-size="13" text-anchor="start" font-weight="800" fill="#22313f" >• vasodilatación (rojez, calor)</text>
<text x="790.0" y="196.0" font-size="13" text-anchor="start" font-weight="800" fill="#22313f" >• más permeabilidad (edema)</text>
