<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Órganos linfoides y células del sistema inmunitario</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<text x="560.0" y="30.0" font-size="16" text-anchor="middle" font-weight="900" fill="#0f4c81" >ÓRGANOS Y CÉLULAS DEL SISTEMA INMUNITARIO</text>
<rect x="20" y="50" width="400" height="430" rx="16" fill="#fff" stroke="#0f4c81" stroke-width="2.5"/><text x="220.0" y="80.0" font-size="16" text-anchor="middle" font-weight="900" fill="#0f4c81" >Órganos linfoides</text>
<text x="220.0" y="110.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c0392b" >PRIMARIOS: se forman y maduran los linfocitos</text>
<rect x="35.0" y="129.0" width="170" height="58" rx="12" fill="#fdeaea" stroke="#c0392b" stroke-width="2.5"/><text x="120.0" y="155.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c0392b" >Médula ósea</text>
<text x="120.0" y="173.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >origen de todas; maduran B</text>
<rect x="235.0" y="129.0" width="170" height="58" rx="12" fill="#fdeaea" stroke="#c0392b" stroke-width="2.5"/><text x="320.0" y="155.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c0392b" >Timo</text>
<text x="320.0" y="173.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >maduran los linfocitos T</text>
<text x="220.0" y="230.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >SECUNDARIOS: los linfocitos se encuentran</text>
<text x="220.0" y="248.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >con los antígenos y se activan</text>
<rect x="35.0" y="271.0" width="170" height="58" rx="12" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2.5"/><text x="120.0" y="297.0" font-size="14" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Ganglios linfáticos</text>
<text x="120.0" y="315.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >filtran la linfa</text>
<rect x="235.0" y="271.0" width="170" height="58" rx="12" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2.5"/><text x="320.0" y="297.0" font-size="15" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Bazo</text>
<text x="320.0" y="315.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >filtra la sangre</text>
<rect x="70.0" y="361.0" width="300" height="58" rx="12" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2.5"/><text x="220.0" y="387.0" font-size="14" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Amígdalas, placas de Peyer…</text>
<text x="220.0" y="405.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >tejido linfoide de las mucosas</text>
<rect x="450" y="50" width="650" height="430" rx="16" fill="#fff" stroke="#6d3fc0" stroke-width="2.5"/><circle cx="775" cy="110" r="22" fill="#f4f7fa" stroke="#4c5b67" stroke-width="2.5"/><circle cx="775" cy="110" r="13.64" fill="#4c5b67" opacity="0.35"/><text x="775.0" y="80.0" font-size="13" text-anchor="middle" font-weight="900" fill="#4c5b67" >célula madre de la médula ósea</text>
<line x1="755.0" y1="128.0" x2="630.0" y2="180.0" stroke="#4c5b67" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><line x1="795.0" y1="128.0" x2="920.0" y2="180.0" stroke="#4c5b67" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><text x="680.0" y="150.0" font-size="14" text-anchor="end" font-weight="900" fill="#c77d00" >línea mieloide</text>
<text x="870.0" y="150.0" font-size="14" text-anchor="start" font-weight="900" fill="#6d3fc0" >línea linfoide</text>
<circle cx="510" cy="240" r="22" fill="#fff4df" stroke="#c77d00" stroke-width="2.5"/><circle cx="502.3" cy="236.7" r="5.279999999999999" fill="#c77d00" opacity="0.4"/><circle cx="511.1" cy="244.4" r="5.279999999999999" fill="#c77d00" opacity="0.4"/><circle cx="518.36" cy="237.36" r="5.279999999999999" fill="#c77d00" opacity="0.4"/><text x="510.0" y="284.0" font-size="12.5" text-anchor="middle" font-weight="900" fill="#c77d00" >Neutrófilo</text>
<text x="510.0" y="300.0" font-size="12.5" text-anchor="middle" font-weight="900" fill="#c77d00" >fagocito</text>
<circle cx="590" cy="240" r="22" fill="#fff4df" stroke="#c77d00" stroke-width="2.5"/><path d="M580.1,235.6 q9.9,-11.0 19.8,0 q-2.2,5.5 -2.2,9.9 q-8.8,4.4 -17.6,-9.9z" fill="#c77d00" opacity="0.4"/><text x="590.0" y="284.0" font-size="12.5" text-anchor="middle" font-weight="900" fill="#c77d00" >Monocito →</text>
<text x="590.0" y="300.0" font-size="12.5" text-anchor="middle" font-weight="900" fill="#c77d00" >macrófago</text>
<circle cx="670" cy="240" r="22" fill="#fff4df" stroke="#c77d00" stroke-width="2.5"/><circle cx="670" cy="240" r="13.64" fill="#c77d00" opacity="0.35"/><text x="670.0" y="284.0" font-size="12.5" text-anchor="middle" font-weight="900" fill="#c77d00" >Mastocito,</text>
<text x="670.0" y="300.0" font-size="12.5" text-anchor="middle" font-weight="900" fill="#c77d00" >basófilo</text>
<circle cx="850" cy="240" r="20" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2.5"/><circle cx="850" cy="240" r="12.4" fill="#6d3fc0" opacity="0.35"/><text x="850.0" y="284.0" font-size="12.5" text-anchor="middle" font-weight="900" fill="#6d3fc0" >Linfocito B</text>
<circle cx="940" cy="240" r="20" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2.5"/><circle cx="940" cy="240" r="12.4" fill="#6d3fc0" opacity="0.35"/><text x="940.0" y="284.0" font-size="12.5" text-anchor="middle" font-weight="900" fill="#6d3fc0" >Linfocito T</text>
<circle cx="1030" cy="240" r="20" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2.5"/><circle cx="1030" cy="240" r="12.4" fill="#6d3fc0" opacity="0.35"/><text x="1030.0" y="284.0" font-size="12.5" text-anchor="middle" font-weight="900" fill="#6d3fc0" >Célula NK</text>
<line x1="510.0" y1="214.0" x2="670.0" y2="214.0" stroke="#c77d00" stroke-width="2" stroke-linecap="round" /><line x1="590.0" y1="196.0" x2="590.0" y2="214.0" stroke="#c77d00" stroke-width="2" stroke-linecap="round" /><line x1="850.0" y1="214.0" x2="1030.0" y2="214.0" stroke="#6d3fc0" stroke-width="2" stroke-linecap="round" /><line x1="940.0" y1="196.0" x2="940.0" y2="214.0" stroke="#6d3fc0" stroke-width="2" stroke-linecap="round" /><text x="470.0" y="345.0" font-size="13" text-anchor="start" font-weight="800" fill="#c77d00" >Neutrófilos y macrófagos: fagocitosis; el macrófago presenta antígenos.</text>
<text x="470.0" y="371.0" font-size="13" text-anchor="start" font-weight="800" fill="#c77d00" >Mastocitos y basófilos: liberan histamina (inflamación, alergia).</text>
<text x="470.0" y="397.0" font-size="13" text-anchor="start" font-weight="800" fill="#6d3fc0" >Linfocitos B: se transforman en células plasmáticas (anticuerpos) y de memoria.</text>
<text x="470.0" y="423.0" font-size="13" text-anchor="start" font-weight="800" fill="#6d3fc0" >Linfocitos T: cooperadores (activan a otros) y citotóxicos (destruyen células).</text>
<text x="470.0" y="449.0" font-size="13" text-anchor="start" font-weight="800" fill="#6d3fc0" >Células NK: destruyen células infectadas o tumorales sin reconocer un antígeno concreto.</text>
</svg>
