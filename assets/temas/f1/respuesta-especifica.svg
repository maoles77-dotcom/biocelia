<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Respuesta inmunitaria específica humoral y celular</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<text x="560.0" y="28.0" font-size="16" text-anchor="middle" font-weight="900" fill="#0f4c81" >RESPUESTA INMUNITARIA ESPECÍFICA: humoral y celular</text>
<path d="M60,170 q-10,-70 60,-80 q70,-10 90,40 q30,60 -20,90 q-60,30 -100,0 q-40,-20 -30,-50z" fill="#fff4df" stroke="#c77d00" stroke-width="3"/><rect x="94.7" y="132.8" width="30.6" height="14.4" rx="7.2" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2" transform="rotate(0 110 140)"/><text x="130.0" y="258.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#c77d00" >1 · Macrófago (CPA)</text>
<text x="130.0" y="276.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >fagocita y procesa</text>
<text x="130.0" y="292.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >el antígeno</text>
<path d="M208,150 h14 v-14 h10 v28 h-24z" fill="#6d3fc0"/><circle cx="236" cy="150" r="6" fill="#3f8a3a"/><text x="230.0" y="110.0" font-size="12.5" text-anchor="middle" font-weight="900" fill="#6d3fc0" >CMH + antígeno</text>
<circle cx="330" cy="150" r="32" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2.5"/><circle cx="330" cy="150" r="19.84" fill="#6d3fc0" opacity="0.35"/><text x="318.0" y="204.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#6d3fc0" >2 · Linfocito T</text>
<text x="318.0" y="222.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#6d3fc0" >cooperador (Th)</text>
<text x="318.0" y="240.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >reconoce el antígeno</text>
<text x="318.0" y="256.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >y libera citocinas</text>
<line x1="250.0" y1="150.0" x2="292.0" y2="150.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><line x1="360.0" y1="130.0" x2="470.0" y2="90.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><line x1="360.0" y1="175.0" x2="470.0" y2="330.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><rect x="480" y="46" width="620" height="200" rx="16" fill="#f3f9ff" stroke="#0f4c81" stroke-width="2.5"/><text x="790.0" y="70.0" font-size="15" text-anchor="middle" font-weight="900" fill="#0f4c81" >HUMORAL (anticuerpos)</text>
<circle cx="540" cy="140" r="28" fill="#e3eef8" stroke="#0f4c81" stroke-width="2.5"/><circle cx="540" cy="140" r="17.36" fill="#0f4c81" opacity="0.35"/><text x="540.0" y="196.0" font-size="13" text-anchor="middle" font-weight="900" fill="#0f4c81" >Linfocito B</text>
<text x="540.0" y="212.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >activado</text>
<line x1="572.0" y1="125.0" x2="660.0" y2="105.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><line x1="572.0" y1="155.0" x2="660.0" y2="185.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><circle cx="700" cy="105" r="26" fill="#e3eef8" stroke="#0f4c81" stroke-width="2.5"/><path d="M688.3,99.8 q11.700000000000001,-13.0 23.400000000000002,0 q-2.6,6.5 -2.6,11.700000000000001 q-10.4,5.2 -20.8,-11.700000000000001z" fill="#0f4c81" opacity="0.4"/><text x="780.0" y="100.0" font-size="13" text-anchor="start" font-weight="900" fill="#0f4c81" >Célula plasmática</text>
<text x="780.0" y="118.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >fabrica anticuerpos</text>
<g transform="rotate(-30 940 115)"><line x1="940.0" y1="115.0" x2="940.0" y2="133.2" stroke="#0f4c81" stroke-width="2.8" stroke-linecap="round" /><line x1="940.0" y1="115.0" x2="927.7" y2="99.6" stroke="#0f4c81" stroke-width="2.8" stroke-linecap="round" /><line x1="940.0" y1="115.0" x2="952.3" y2="99.6" stroke="#0f4c81" stroke-width="2.8" stroke-linecap="round" /></g><g transform="rotate(-10 970 115)"><line x1="970.0" y1="115.0" x2="970.0" y2="133.2" stroke="#0f4c81" stroke-width="2.8" stroke-linecap="round" /><line x1="970.0" y1="115.0" x2="957.7" y2="99.6" stroke="#0f4c81" stroke-width="2.8" stroke-linecap="round" /><line x1="970.0" y1="115.0" x2="982.3" y2="99.6" stroke="#0f4c81" stroke-width="2.8" stroke-linecap="round" /></g><g transform="rotate(10 1000 115)"><line x1="1000.0" y1="115.0" x2="1000.0" y2="133.2" stroke="#0f4c81" stroke-width="2.8" stroke-linecap="round" /><line x1="1000.0" y1="115.0" x2="987.7" y2="99.6" stroke="#0f4c81" stroke-width="2.8" stroke-linecap="round" /><line x1="1000.0" y1="115.0" x2="1012.3" y2="99.6" stroke="#0f4c81" stroke-width="2.8" stroke-linecap="round" /></g><g transform="rotate(30 1030 115)"><line x1="1030.0" y1="115.0" x2="1030.0" y2="133.2" stroke="#0f4c81" stroke-width="2.8" stroke-linecap="round" /><line x1="1030.0" y1="115.0" x2="1017.7" y2="99.6" stroke="#0f4c81" stroke-width="2.8" stroke-linecap="round" /><line x1="1030.0" y1="115.0" x2="1042.3" y2="99.6" stroke="#0f4c81" stroke-width="2.8" stroke-linecap="round" /></g><circle cx="700" cy="190" r="22" fill="#fff" stroke="#0f4c81" stroke-width="2.5"/><circle cx="700" cy="190" r="13.64" fill="#0f4c81" opacity="0.35"/><text x="780.0" y="186.0" font-size="13" text-anchor="start" font-weight="900" fill="#0f4c81" >Linfocito B de memoria</text>
<text x="780.0" y="204.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >respuesta secundaria</text>
<text x="790.0" y="232.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >frente a antígenos extracelulares (bacterias, toxinas, virus libres)</text>
<rect x="480" y="262" width="620" height="200" rx="16" fill="#fbf7ff" stroke="#6d3fc0" stroke-width="2.5"/><text x="790.0" y="286.0" font-size="15" text-anchor="middle" font-weight="900" fill="#6d3fc0" >CELULAR (linfocitos T citotóxicos)</text>
<circle cx="540" cy="360" r="28" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2.5"/><circle cx="540" cy="360" r="17.36" fill="#6d3fc0" opacity="0.35"/><text x="540.0" y="414.0" font-size="13" text-anchor="middle" font-weight="900" fill="#6d3fc0" >Linfocito Tc</text>
<line x1="572.0" y1="360.0" x2="660.0" y2="360.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><circle cx="720" cy="360" r="40" fill="#fdeaea" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="720" cy="360" r="14" fill="#c0392b" opacity="0.3"/><path d="M766.0,360.0 l6.0,0.0" stroke="#c0392b" stroke-width="3"/><path d="M743.0,399.8 l3.0,5.2" stroke="#c0392b" stroke-width="3"/><path d="M697.0,399.8 l-3.0,5.2" stroke="#c0392b" stroke-width="3"/><path d="M674.0,360.0 l-6.0,0.0" stroke="#c0392b" stroke-width="3"/><path d="M697.0,320.2 l-3.0,-5.2" stroke="#c0392b" stroke-width="3"/><path d="M743.0,320.2 l3.0,-5.2" stroke="#c0392b" stroke-width="3"/><text x="780.0" y="340.0" font-size="13" text-anchor="start" font-weight="900" fill="#c0392b" >destruye células infectadas</text>
<text x="780.0" y="358.0" font-size="13" text-anchor="start" font-weight="900" fill="#c0392b" >por virus, tumorales</text>
<text x="780.0" y="376.0" font-size="13" text-anchor="start" font-weight="900" fill="#c0392b" >o trasplantadas</text>
<text x="780.0" y="404.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >(las reconoce por su CMH</text>
<text x="780.0" y="420.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >con antígenos extraños)</text>
<text x="790.0" y="450.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >también deja linfocitos T de memoria</text>
</svg>
