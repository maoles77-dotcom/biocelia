<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Estructura de un anticuerpo</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<path d="M346,490 V300 L225.8,179.8" fill="none" stroke="#0f4c81" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><line x1="291.6" y1="282.3" x2="207.4" y2="198.2" stroke="#2a9d8f" stroke-width="14" stroke-linecap="round" /><line x1="250.3" y1="222.6" x2="214.2" y2="186.6" stroke="#c77d00" stroke-width="54" stroke-linecap="round" opacity="0.28"/><line x1="295.5" y1="249.5" x2="277.1" y2="267.9" stroke="#c0392b" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M374,490 V300 L494.2,179.8" fill="none" stroke="#0f4c81" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><line x1="428.4" y1="282.3" x2="512.6" y2="198.2" stroke="#2a9d8f" stroke-width="14" stroke-linecap="round" /><line x1="469.7" y1="222.6" x2="505.8" y2="186.6" stroke="#c77d00" stroke-width="54" stroke-linecap="round" opacity="0.28"/><line x1="424.5" y1="249.5" x2="442.9" y2="267.9" stroke="#c0392b" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="346.0" y1="318.0" x2="374.0" y2="318.0" stroke="#c0392b" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="346.0" y1="336.0" x2="374.0" y2="336.0" stroke="#c0392b" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 3"/><g transform="translate(-4,40)"><path d="M150,60 q-30,40 10,70 q30,30 70,0 q40,-30 10,-70 q-40,-40 -90,0z" fill="#efe7fb" stroke="#6d3fc0" stroke-width="3"/><path d="M218,118 l14,14 l-14,10 z" fill="#6d3fc0"/></g><text x="140.0" y="90.0" font-size="14" text-anchor="end" font-weight="900" fill="#6d3fc0" >antígeno</text>
<text x="600.0" y="120.0" font-size="15" text-anchor="start" font-weight="900" fill="#c77d00" >Región variable (Fab):</text>
<text x="600.0" y="140.0" font-size="12.5" text-anchor="start" font-weight="800" fill="#4c5b67" >se une al antígeno → parátopo</text>
<text x="600.0" y="190.0" font-size="15" text-anchor="start" font-weight="900" fill="#2a9d8f" >Cadena ligera (L)</text>
<text x="600.0" y="210.0" font-size="12.5" text-anchor="start" font-weight="800" fill="#4c5b67" >2 iguales</text>
<text x="600.0" y="250.0" font-size="15" text-anchor="start" font-weight="900" fill="#0f4c81" >Cadena pesada (H)</text>
<text x="600.0" y="270.0" font-size="12.5" text-anchor="start" font-weight="800" fill="#4c5b67" >2 iguales; forman el tallo</text>
<text x="600.0" y="320.0" font-size="15" text-anchor="start" font-weight="900" fill="#c0392b" >Puentes disulfuro</text>
<text x="600.0" y="340.0" font-size="12.5" text-anchor="start" font-weight="800" fill="#4c5b67" >unen las cadenas</text>
<text x="600.0" y="410.0" font-size="15" text-anchor="start" font-weight="900" fill="#22313f" >Región constante (Fc)</text>
<text x="600.0" y="430.0" font-size="12.5" text-anchor="start" font-weight="800" fill="#4c5b67" >la reconocen fagocitos y complemento;</text>
<text x="600.0" y="450.0" font-size="12.5" text-anchor="start" font-weight="800" fill="#4c5b67" >define la clase (IgG, IgA, IgM, IgE, IgD)</text>
<line x1="470.0" y1="185.0" x2="590.0" y2="120.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><line x1="497.0" y1="190.0" x2="590.0" y2="188.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><line x1="392.0" y1="260.0" x2="590.0" y2="248.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><line x1="378.0" y1="330.0" x2="590.0" y2="318.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><line x1="380.0" y1="440.0" x2="590.0" y2="410.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><text x="40.0" y="200.0" font-size="13" text-anchor="start" font-weight="900" fill="#6d3fc0" >epítopo: zona del</text>
<text x="40.0" y="218.0" font-size="13" text-anchor="start" font-weight="900" fill="#6d3fc0" >antígeno que reconoce</text>
<text x="40.0" y="236.0" font-size="13" text-anchor="start" font-weight="900" fill="#6d3fc0" >el anticuerpo</text>
<line x1="110.0" y1="186.0" x2="212.0" y2="172.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><text x="450.0" y="520.0" font-size="14" text-anchor="middle" font-weight="900" fill="#0f4c81" >Glucoproteína en forma de Y (inmunoglobulina), fabricada por las células plasmáticas.</text>
</svg>
