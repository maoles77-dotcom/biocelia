<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 490" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Fermentación láctica y alcohólica a partir del piruvato</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="10" y="10" width="1000" height="470" rx="20" fill="#fdf3e7" stroke="#2a7fc1" stroke-width="3"/><text x="30.0" y="40.0" font-size="15" text-anchor="start" font-weight="900" fill="#2a7fc1" >CITOSOL · sin oxígeno</text>
<rect x="420.0" y="56.0" width="180" height="48" rx="12" fill="#e3eef8" stroke="#0f4c81" stroke-width="2.5"/><text x="510.0" y="86.3" font-size="18" text-anchor="middle" font-weight="900" fill="#0f4c81" >Glucosa</text>
<line x1="510.0" y1="106.0" x2="510.0" y2="186.0" stroke="#c0392b" stroke-width="4" stroke-linecap="round" marker-end="url(#fk)"/><text x="524.0" y="140.0" font-size="15" text-anchor="start" font-weight="900" fill="#c0392b" >glucólisis</text>
<rect x="364.79" y="118" width="70.42" height="28" rx="14" fill="#fff4df" stroke="#c77d00" stroke-width="2"/><text x="400.0" y="137.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c77d00" >+ 2 ATP</text>
<rect x="337.2" y="154" width="125.6" height="28" rx="14" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2"/><text x="400.0" y="173.0" font-size="12" text-anchor="middle" font-weight="900" fill="#6d3fc0" >2 NAD⁺ → 2 NADH</text>
<rect x="410.0" y="188.0" width="200" height="48" rx="12" fill="#fff" stroke="#22313f" stroke-width="2.5"/><text x="510.0" y="218.3" font-size="18" text-anchor="middle" font-weight="900" fill="#22313f" >2 Piruvato</text>
<line x1="420.0" y1="236.0" x2="250.0" y2="330.0" stroke="#6d3fc0" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fk)"/><rect x="95.0" y="333.0" width="230" height="54" rx="12" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2.5"/><text x="210.0" y="357.0" font-size="17" text-anchor="middle" font-weight="900" fill="#6d3fc0" >2 Lactato</text>
<text x="210.0" y="375.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >(ácido láctico)</text>
<text x="210.0" y="410.0" font-size="15" text-anchor="middle" font-weight="900" fill="#6d3fc0" >FERMENTACIÓN LÁCTICA</text>
<text x="210.0" y="430.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >bacterias lácticas, músculo,</text>
<text x="210.0" y="446.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >glóbulos rojos</text>
<line x1="600.0" y1="236.0" x2="770.0" y2="330.0" stroke="#c77d00" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fk)"/><rect x="685.0" y="333.0" width="250" height="54" rx="12" fill="#fff4df" stroke="#c77d00" stroke-width="2.5"/><text x="810.0" y="365.9" font-size="17" text-anchor="middle" font-weight="900" fill="#c77d00" >2 Etanol + 2 CO₂</text>
<text x="810.0" y="410.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c77d00" >FERMENTACIÓN ALCOHÓLICA</text>
<text x="810.0" y="430.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >levaduras (Saccharomyces)</text>
<text x="810.0" y="446.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >y algunas células vegetales</text>
<text x="510.0" y="300.0" font-size="13" text-anchor="middle" font-weight="900" fill="#6d3fc0" >el NADH se oxida a NAD⁺ al reducir el piruvato:</text>
<text x="510.0" y="318.0" font-size="13" text-anchor="middle" font-weight="900" fill="#6d3fc0" >así la glucólisis puede continuar</text>
<text x="510.0" y="470.0" font-size="13" text-anchor="middle" font-weight="800" fill="#0f4c81" >Balance: 2 ATP por glucosa (solo los de la glucólisis) · el NADH no gana nada: se regenera NAD⁺</text>
</svg>
