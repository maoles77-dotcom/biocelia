<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 325" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Aplicaciones industriales de las fermentaciones, con ejemplos de Andalucía</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="10" y="10" width="330" height="270" rx="16" fill="#fff4df" stroke="#c77d00" stroke-width="2.5"/><text x="175.0" y="42.0" font-size="17" text-anchor="middle" font-weight="900" fill="#c77d00" >Alcohólica · levaduras</text>
<text x="32.0" y="80.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Pan: el CO₂ hace subir la masa</text>
<text x="32.0" y="114.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Vino (mosto de uva), cerveza, sidra</text>
<text x="32.0" y="148.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Vinos finos de Jerez y Montilla:</text>
<text x="46.0" y="182.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >crianza bajo el «velo de flor»</text>
<text x="32.0" y="216.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Bioetanol (combustible)</text>
<rect x="350" y="10" width="330" height="270" rx="16" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2.5"/><text x="515.0" y="42.0" font-size="17" text-anchor="middle" font-weight="900" fill="#6d3fc0" >Láctica · bacterias lácticas</text>
<text x="372.0" y="80.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Yogur, kéfir, quesos</text>
<text x="372.0" y="114.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Aceitunas de mesa (aderezo</text>
<text x="386.0" y="148.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >«estilo sevillano» en salmuera)</text>
<text x="372.0" y="182.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Encurtidos, chucrut</text>
<text x="372.0" y="216.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Embutidos curados</text>
<rect x="690" y="10" width="330" height="270" rx="16" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2.5"/><text x="855.0" y="42.0" font-size="17" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Otras</text>
<text x="712.0" y="80.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Acética (Acetobacter): vinagre,</text>
<text x="726.0" y="114.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >como el vinagre de Jerez</text>
<text x="712.0" y="148.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Biogás (metano) a partir de</text>
<text x="726.0" y="182.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >residuos agrícolas y ganaderos</text>
<text x="712.0" y="216.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Antibióticos, enzimas, ácidos</text>
<text x="515.0" y="310.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#0f4c81" >Andalucía: aceituna de mesa, vinos y vinagres de Jerez, Montilla-Moriles y el Condado, quesos… y valorización de residuos.</text>
</svg>
