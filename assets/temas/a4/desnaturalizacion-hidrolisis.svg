<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>La desnaturalización pierde la forma pero conserva la secuencia; la hidrólisis rompe la cadena en aminoácidos</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<text x="140.0" y="28.0" font-size="17" text-anchor="middle" font-weight="900" fill="#0f4c81" >Proteína nativa</text>
<path d="M60,200 C40,140 100,80 160,100 C220,120 190,170 150,170 C110,170 120,90 180,70 C240,50 260,120 230,170 C200,210 140,230 110,215" fill="none" stroke="#d1495b" stroke-width="9" stroke-linecap="round"/><text x="140.0" y="255.0" font-size="13" text-anchor="middle" font-weight="800" fill="#3f8a3a" >forma 3D → funcional</text>
<line x1="270" y1="120" x2="370" y2="120" stroke="#22313f" stroke-width="3" marker-end="url(#fk)"/><line x1="370" y1="150" x2="270" y2="150" stroke="#22313f" stroke-width="3" marker-end="url(#fk)" stroke-dasharray="6 4"/><text x="320.0" y="106.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c0392b" >calor, pH extremo</text>
<text x="320.0" y="175.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >renaturalización</text>
<text x="320.0" y="192.0" font-size="11" text-anchor="middle" font-weight="800" fill="#4c5b67" >(si es reversible)</text>
<text x="510.0" y="28.0" font-size="17" text-anchor="middle" font-weight="900" fill="#0f4c81" >Desnaturalizada</text>
<path d="M390,140 C420,110 450,170 480,130 C510,90 540,170 570,130 C600,95 620,150 640,120" fill="none" stroke="#d1495b" stroke-width="9" stroke-linecap="round"/><text x="515.0" y="210.0" font-size="13" text-anchor="middle" font-weight="800" fill="#c0392b" >se pierden 2.ª, 3.ª y 4.ª</text>
<text x="515.0" y="228.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >se conserva la 1.ª (enlaces peptídicos)</text>
<text x="515.0" y="255.0" font-size="13" text-anchor="middle" font-weight="800" fill="#c0392b" >→ pierde la función</text>
<line x1="680" y1="30" x2="680" y2="265" stroke="#dde5ec" stroke-width="2"/><text x="840.0" y="28.0" font-size="17" text-anchor="middle" font-weight="900" fill="#0f4c81" >Hidrólisis</text>
<circle cx="730" cy="130" r="13" fill="#e76f51"/><circle cx="764" cy="150" r="13" fill="#f4a261"/><circle cx="798" cy="130" r="13" fill="#e9c46a"/><circle cx="832" cy="150" r="13" fill="#2a9d8f"/><circle cx="866" cy="130" r="13" fill="#264653"/><circle cx="900" cy="150" r="13" fill="#8ab17d"/><circle cx="934" cy="130" r="13" fill="#bc6c25"/><text x="840.0" y="210.0" font-size="13" text-anchor="middle" font-weight="800" fill="#c0392b" >rompe los enlaces peptídicos</text>
<text x="840.0" y="228.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >(enzimas proteasas, ácidos)</text>
<text x="840.0" y="255.0" font-size="13" text-anchor="middle" font-weight="800" fill="#0f4c81" >→ aminoácidos libres</text>
</svg>
