<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Ciclo del ATP y del NAD como transportadores de energía y de poder reductor</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<text x="250.0" y="34.0" font-size="18" text-anchor="middle" font-weight="900" fill="#c77d00" >El ATP, moneda energética</text>
<ellipse cx="250" cy="90" rx="62" ry="30" fill="#fff4df" stroke="#c77d00" stroke-width="3"/><text x="250.0" y="97.0" font-size="22" text-anchor="middle" font-weight="900" fill="#c77d00" >ATP</text>
<ellipse cx="250" cy="280" rx="80" ry="30" fill="#fff" stroke="#c77d00" stroke-width="3"/><text x="250.0" y="287.0" font-size="20" text-anchor="middle" font-weight="900" fill="#c77d00" >ADP + Pi</text>
<path d="M190,262 C110,220 110,150 190,110" fill="none" stroke="#c0392b" stroke-width="4" marker-end="url(#fk)"/><path d="M310,110 C390,150 390,220 310,262" fill="none" stroke="#3f8a3a" stroke-width="4" marker-end="url(#fk)"/><text x="80.0" y="170.0" font-size="14" text-anchor="middle" font-weight="900" fill="#c0392b" >síntesis</text>
<text x="80.0" y="188.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >(fosforilación)</text>
<text x="80.0" y="210.0" font-size="12" text-anchor="middle" font-weight="800" fill="#c0392b" >energía del</text>
<text x="80.0" y="226.0" font-size="12" text-anchor="middle" font-weight="800" fill="#c0392b" >catabolismo</text>
<text x="450.0" y="170.0" font-size="14" text-anchor="middle" font-weight="900" fill="#3f8a3a" >hidrólisis</text>
<text x="450.0" y="188.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >libera energía</text>
<text x="450.0" y="210.0" font-size="12" text-anchor="middle" font-weight="800" fill="#3f8a3a" >para el anabolismo,</text>
<text x="450.0" y="226.0" font-size="12" text-anchor="middle" font-weight="800" fill="#3f8a3a" >el transporte, el movimiento</text>
<text x="250.0" y="342.0" font-size="12.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >Se obtiene por fosforilación a nivel de sustrato,</text>
<text x="250.0" y="360.0" font-size="12.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >fosforilación oxidativa o fotofosforilación</text>
<text x="760.0" y="34.0" font-size="18" text-anchor="middle" font-weight="900" fill="#6d3fc0" >El poder reductor</text>
<ellipse cx="760" cy="90" rx="70" ry="30" fill="#fff" stroke="#6d3fc0" stroke-width="3"/><text x="760.0" y="97.0" font-size="20" text-anchor="middle" font-weight="900" fill="#6d3fc0" >NAD⁺</text>
<ellipse cx="760" cy="280" rx="80" ry="30" fill="#efe7fb" stroke="#6d3fc0" stroke-width="3"/><text x="760.0" y="287.0" font-size="20" text-anchor="middle" font-weight="900" fill="#6d3fc0" >NADH + H⁺</text>
<path d="M700,110 C620,150 620,220 700,262" fill="none" stroke="#c0392b" stroke-width="4" marker-end="url(#fk)"/><path d="M820,262 C900,220 900,150 820,110" fill="none" stroke="#3f8a3a" stroke-width="4" marker-end="url(#fk)"/><text x="585.0" y="160.0" font-size="14" text-anchor="middle" font-weight="900" fill="#c0392b" >se reduce:</text>
<text x="585.0" y="178.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >capta 2 e⁻ y H⁺</text>
<text x="585.0" y="196.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >de un sustrato</text>
<text x="585.0" y="214.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >que se oxida</text>
<text x="945.0" y="160.0" font-size="14" text-anchor="middle" font-weight="900" fill="#3f8a3a" >se oxida:</text>
<text x="945.0" y="178.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >cede e⁻ y H⁺ a la</text>
<text x="945.0" y="196.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >cadena respiratoria</text>
<text x="945.0" y="214.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >(o a una síntesis)</text>
<text x="760.0" y="342.0" font-size="12.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >NADH y FADH₂: catabolismo (respiración)</text>
<text x="760.0" y="360.0" font-size="12.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >NADPH: anabolismo (fotosíntesis, síntesis de lípidos)</text>
</svg>
