<text x="445.0" y="278.0" font-size="13" text-anchor="middle" font-weight="800" fill="#0f4c81" >Si sobra D, se frena su propia síntesis; cuando D se gasta, la enzima 1 vuelve a funcionar (inhibición alostérica).</text>
