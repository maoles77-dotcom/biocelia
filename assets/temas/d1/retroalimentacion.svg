<path d="M790,156 C790,240 215,240 215,100" fill="none" stroke="#c0392b" stroke-width="3.5" stroke-dasharray="9 6" marker-end="url(#fk)"/><text x="500.0" y="232.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c0392b" >el producto final D inhibe a la enzima 1</text>
