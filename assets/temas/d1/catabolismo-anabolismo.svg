<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 415" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Catabolismo y anabolismo conectados por el ATP y el poder reductor</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="40.0" y="55.0" width="260" height="70" rx="12" fill="#e3eef8" stroke="#0f4c81" stroke-width="2.5"/><text x="170.0" y="87.0" font-size="17" text-anchor="middle" font-weight="900" fill="#0f4c81" >Moléculas complejas</text>
<text x="170.0" y="105.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >polisacáridos, lípidos, proteínas</text>
<rect x="40.0" y="295.0" width="260" height="70" rx="12" fill="#e3eef8" stroke="#0f4c81" stroke-width="2.5"/><text x="170.0" y="327.0" font-size="17" text-anchor="middle" font-weight="900" fill="#0f4c81" >Moléculas sencillas</text>
<text x="170.0" y="345.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >CO₂, H₂O, NH₃, lactato…</text>
<rect x="700.0" y="55.0" width="260" height="70" rx="12" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2.5"/><text x="830.0" y="87.0" font-size="17" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Moléculas complejas</text>
<text x="830.0" y="105.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >glúcidos, lípidos, proteínas, ADN</text>
<rect x="700.0" y="295.0" width="260" height="70" rx="12" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2.5"/><text x="830.0" y="327.0" font-size="17" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Precursores sencillos</text>
<text x="830.0" y="345.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >monosacáridos, aminoácidos…</text>
<line x1="170.0" y1="128.0" x2="170.0" y2="290.0" stroke="#c0392b" stroke-width="4" stroke-linecap="round" marker-end="url(#fk)"/><line x1="830.0" y1="290.0" x2="830.0" y2="128.0" stroke="#3f8a3a" stroke-width="4" stroke-linecap="round" marker-end="url(#fk)"/><text x="60.0" y="200.0" font-size="18" text-anchor="middle" font-weight="900" fill="#c0392b" transform="rotate(-90 60 200)">CATABOLISMO</text>
<text x="940.0" y="210.0" font-size="18" text-anchor="middle" font-weight="900" fill="#3f8a3a" transform="rotate(90 940 210)">ANABOLISMO</text>
<text x="190.0" y="190.0" font-size="14" text-anchor="start" font-weight="800" fill="#c0392b" >• degradación</text>
<text x="190.0" y="212.0" font-size="14" text-anchor="start" font-weight="800" fill="#c0392b" >• oxidación</text>
<text x="190.0" y="234.0" font-size="14" text-anchor="start" font-weight="800" fill="#c0392b" >• libera energía (exergónico)</text>
<text x="810.0" y="190.0" font-size="14" text-anchor="end" font-weight="800" fill="#3f8a3a" >síntesis •</text>
<text x="810.0" y="212.0" font-size="14" text-anchor="end" font-weight="800" fill="#3f8a3a" >reducción •</text>
<text x="810.0" y="234.0" font-size="14" text-anchor="end" font-weight="800" fill="#3f8a3a" >consume energía (endergónico) •</text>
<ellipse cx="500" cy="160" rx="96" ry="36" fill="#fff4df" stroke="#c77d00" stroke-width="3"/><text x="500.0" y="158.0" font-size="22" text-anchor="middle" font-weight="900" fill="#c77d00" >ATP</text>
<text x="500.0" y="178.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >energía</text>
<ellipse cx="500" cy="270" rx="118" ry="36" fill="#efe7fb" stroke="#6d3fc0" stroke-width="3"/><text x="500.0" y="266.0" font-size="15" text-anchor="middle" font-weight="900" fill="#6d3fc0" >NADH · NADPH · FADH₂</text>
<text x="500.0" y="286.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >poder reductor</text>
<line x1="300.0" y1="160.0" x2="398.0" y2="160.0" stroke="#c77d00" stroke-width="3" stroke-linecap="round" marker-end="url(#fk)"/><line x1="602.0" y1="160.0" x2="700.0" y2="160.0" stroke="#c77d00" stroke-width="3" stroke-linecap="round" marker-end="url(#fk)"/><line x1="300.0" y1="270.0" x2="378.0" y2="270.0" stroke="#6d3fc0" stroke-width="3" stroke-linecap="round" marker-end="url(#fk)"/><line x1="622.0" y1="270.0" x2="700.0" y2="270.0" stroke="#6d3fc0" stroke-width="3" stroke-linecap="round" marker-end="url(#fk)"/><text x="500.0" y="110.0" font-size="13" text-anchor="middle" font-weight="900" fill="#4c5b67" >el catabolismo los produce · el anabolismo los gasta</text>
<text x="500.0" y="395.0" font-size="13" text-anchor="middle" font-weight="800" fill="#0f4c81" >Además, el catabolismo aporta precursores (metabolitos intermedios) que el anabolismo usa como materia prima.</text>
</svg>
