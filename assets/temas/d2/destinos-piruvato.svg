<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 350" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Destinos del piruvato con oxígeno y sin oxígeno</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="10" y="10" width="1000" height="330" rx="20" fill="#fdf3e7" stroke="#2a7fc1" stroke-width="3"/><text x="30.0" y="40.0" font-size="15" text-anchor="start" font-weight="900" fill="#2a7fc1" >CITOSOL</text>
<rect x="560" y="40" width="430" height="280" rx="60" fill="#fbe3d3" stroke="#b5532c" stroke-width="4"/><text x="970.0" y="70.0" font-size="14" text-anchor="end" font-weight="900" fill="#b5532c" >MITOCONDRIA (matriz)</text>
<rect x="70.0" y="150.0" width="160" height="50" rx="12" fill="#e3eef8" stroke="#0f4c81" stroke-width="2.5"/><text x="150.0" y="180.9" font-size="17" text-anchor="middle" font-weight="900" fill="#0f4c81" >Glucosa</text>
<line x1="232.0" y1="175.0" x2="312.0" y2="175.0" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fk)"/><text x="272.0" y="162.0" font-size="12" text-anchor="middle" font-weight="900" fill="#c0392b" >glucólisis</text>
<rect x="320.0" y="150.0" width="160" height="50" rx="12" fill="#fff" stroke="#22313f" stroke-width="2.5"/><text x="400.0" y="180.9" font-size="17" text-anchor="middle" font-weight="900" fill="#22313f" >2 Piruvato</text>
<line x1="480.0" y1="160.0" x2="640.0" y2="110.0" stroke="#3f8a3a" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fk)"/><text x="545.0" y="152.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >con O₂</text>
<rect x="640.0" y="82.0" width="240" height="56" rx="12" fill="#fff" stroke="#22313f" stroke-width="2.5"/><text x="760.0" y="107.0" font-size="17" text-anchor="middle" font-weight="900" fill="#22313f" >2 Acetil-CoA</text>
<text x="760.0" y="125.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >+ 2 CO₂ + 2 NADH</text>
<text x="760.0" y="160.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >descarboxilación oxidativa</text>
<line x1="760.0" y1="180.0" x2="760.0" y2="230.0" stroke="#22313f" stroke-width="3" stroke-linecap="round" marker-end="url(#fk)"/><rect x="625.0" y="242.0" width="270" height="52" rx="12" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="760.0" y="265.0" font-size="16" text-anchor="middle" font-weight="900" fill="#c0392b" >Ciclo de Krebs →</text>
<text x="760.0" y="283.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >cadena respiratoria → CO₂, H₂O, mucho ATP</text>
<line x1="400.0" y1="202.0" x2="400.0" y2="262.0" stroke="#6d3fc0" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fk)"/><text x="412.0" y="236.0" font-size="13" text-anchor="start" font-weight="900" fill="#6d3fc0" >sin O₂</text>
<rect x="250.0" y="270.0" width="300" height="52" rx="12" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2.5"/><text x="400.0" y="293.0" font-size="16" text-anchor="middle" font-weight="900" fill="#6d3fc0" >Fermentación</text>
<text x="400.0" y="311.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >lactato, o etanol + CO₂; regenera el NAD⁺</text>
