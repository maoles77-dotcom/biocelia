<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Comparación del rendimiento energético de la fermentación y la respiración aerobia</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<text x="450.0" y="34.0" font-size="18" text-anchor="middle" font-weight="900" fill="#0f4c81" >Energía obtenida de una glucosa</text>
<rect x="280" y="352.3529411764706" width="140" height="17.647058823529413" rx="8" fill="#6d3fc0" opacity="0.85"/><text x="350.0" y="340.4" font-size="18" text-anchor="middle" font-weight="900" fill="#6d3fc0" >2 ATP</text>
<text x="350.0" y="398.0" font-size="16" text-anchor="middle" font-weight="900" fill="#22313f" >Fermentación</text>
<rect x="580" y="87.64705882352939" width="140" height="282.3529411764706" rx="8" fill="#3f8a3a" opacity="0.85"/><text x="650.0" y="75.6" font-size="18" text-anchor="middle" font-weight="900" fill="#3f8a3a" >≈ 30-38 ATP*</text>
<text x="650.0" y="398.0" font-size="16" text-anchor="middle" font-weight="900" fill="#22313f" >Respiración aerobia</text>
<line x1="240.0" y1="370.0" x2="860.0" y2="370.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" /><text x="450.0" y="436.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >Fermentación: oxidación incompleta, solo el ATP de la glucólisis. Respiración: oxidación completa a CO₂ y H₂O.</text>
<text x="450.0" y="458.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >* Según el cálculo: los libros clásicos dan 36-38 ATP; los actuales, unos 30-32. Las directrices no piden el balance exacto.</text>
</svg>
