<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Ciclo de Krebs: entradas y productos por vuelta</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="10" y="10" width="1000" height="540" rx="24" fill="#fbe3d3" stroke="#b5532c" stroke-width="3"/><text x="30.0" y="42.0" font-size="15" text-anchor="start" font-weight="900" fill="#b5532c" >MATRIZ MITOCONDRIAL</text>
<circle cx="420" cy="280" r="150" fill="none" stroke="#c0392b" stroke-width="10" opacity="0.85"/><text x="420.0" y="272.0" font-size="20" text-anchor="middle" font-weight="900" fill="#c0392b" >CICLO DE</text>
<text x="420.0" y="300.0" font-size="26" text-anchor="middle" font-weight="900" fill="#c0392b" >KREBS</text>
<text x="420.0" y="328.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >(×2 por cada glucosa)</text>
<rect x="325.0" y="35.0" width="190" height="50" rx="12" fill="#fff" stroke="#22313f" stroke-width="2.5"/><text x="420.0" y="65.2" font-size="15" text-anchor="middle" font-weight="900" fill="#22313f" >Acetil-CoA (2 C)</text>
<line x1="420.0" y1="86.0" x2="420.0" y2="122.0" stroke="#22313f" stroke-width="3" stroke-linecap="round" marker-end="url(#fk)"/><rect x="85.0" y="115.0" width="170" height="50" rx="12" fill="#e0f2ef" stroke="#2a9d8f" stroke-width="2.5"/><text x="170.0" y="144.9" font-size="14" text-anchor="middle" font-weight="900" fill="#2a9d8f" >Oxalacético (4 C)</text>
<line x1="255.0" y1="140.0" x2="330.0" y2="170.0" stroke="#2a9d8f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><text x="170.0" y="182.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#2a9d8f" >se regenera en cada vuelta</text>
<rect x="585.0" y="115.0" width="170" height="50" rx="12" fill="#fff" stroke="#4c5b67" stroke-width="2.5"/><text x="670.0" y="144.9" font-size="14" text-anchor="middle" font-weight="900" fill="#4c5b67" >Citrato (6 C)</text>
<line x1="490.0" y1="140.0" x2="582.0" y2="140.0" stroke="#4c5b67" stroke-width="2" stroke-linecap="round" marker-end="url(#fk)"/><rect x="591.75" y="296" width="56.5" height="28" rx="14" fill="#eef1f4" stroke="#4c5b67" stroke-width="2"/><text x="620.0" y="315.0" font-size="13" text-anchor="middle" font-weight="900" fill="#4c5b67" >2 CO₂</text>
<rect x="597.5" y="356" width="65.0" height="28" rx="14" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2"/><text x="630.0" y="375.0" font-size="13" text-anchor="middle" font-weight="900" fill="#6d3fc0" >3 NADH</text>
<rect x="543.25" y="416" width="73.5" height="28" rx="14" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2"/><text x="580.0" y="435.0" font-size="13" text-anchor="middle" font-weight="900" fill="#6d3fc0" >1 FADH₂</text>
<rect x="217.75" y="446" width="124.5" height="28" rx="14" fill="#fff4df" stroke="#c77d00" stroke-width="2"/><text x="280.0" y="465.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c77d00" >1 GTP (= ATP)</text>
<line x1="525.0" y1="300.0" x2="585.0" y2="310.0" stroke="#4c5b67" stroke-width="2" stroke-linecap="round" marker-end="url(#fk)"/><line x1="510.0" y1="350.0" x2="588.0" y2="368.0" stroke="#6d3fc0" stroke-width="2" stroke-linecap="round" marker-end="url(#fk)"/><line x1="487.5" y1="395.0" x2="545.0" y2="420.0" stroke="#6d3fc0" stroke-width="2" stroke-linecap="round" marker-end="url(#fk)"/><line x1="345.0" y1="400.0" x2="300.0" y2="442.0" stroke="#c77d00" stroke-width="2" stroke-linecap="round" marker-end="url(#fk)"/><rect x="700" y="300" width="290" height="230" rx="16" fill="#fff" stroke="#0f4c81" stroke-width="2.5"/><text x="716.0" y="328.0" font-size="13" text-anchor="start" font-weight="900" fill="#0f4c81" >Por cada acetil-CoA:</text>
<text x="716.0" y="350.0" font-size="13" text-anchor="start" font-weight="800" fill="#22313f" >• oxida el grupo acetilo</text>
<text x="716.0" y="372.0" font-size="13" text-anchor="start" font-weight="800" fill="#22313f" >  hasta 2 CO₂</text>
<text x="716.0" y="394.0" font-size="13" text-anchor="start" font-weight="900" fill="#6d3fc0" >• 3 NADH + 1 FADH₂</text>
<text x="716.0" y="416.0" font-size="13" text-anchor="start" font-weight="800" fill="#4c5b67" >  → a la cadena respiratoria</text>
<text x="716.0" y="438.0" font-size="13" text-anchor="start" font-weight="900" fill="#c77d00" >• 1 GTP (fosforilación</text>
<text x="716.0" y="460.0" font-size="13" text-anchor="start" font-weight="800" fill="#c77d00" >  a nivel de sustrato)</text>
<text x="716.0" y="482.0" font-size="13" text-anchor="start" font-weight="900" fill="#c0392b" >No usa O₂ directamente, pero</text>
<text x="716.0" y="504.0" font-size="13" text-anchor="start" font-weight="900" fill="#c0392b" >sin O₂ se detiene</text>
</svg>
