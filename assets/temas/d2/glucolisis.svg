<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Glucólisis: de una glucosa a dos piruvatos, con balance de ATP y NADH</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="10" y="10" width="980" height="380" rx="20" fill="#fdf3e7" stroke="#2a7fc1" stroke-width="3"/><text x="30.0" y="40.0" font-size="15" text-anchor="start" font-weight="900" fill="#2a7fc1" >CITOSOL</text>
<text x="160.0" y="90.0" font-size="18" text-anchor="middle" font-weight="900" fill="#0f4c81" >Glucosa</text>
<circle cx="105" cy="120" r="9" fill="#7fb3e6" stroke="#22313f" stroke-width="1.3"/><circle cx="127" cy="120" r="9" fill="#7fb3e6" stroke="#22313f" stroke-width="1.3"/><circle cx="149" cy="120" r="9" fill="#7fb3e6" stroke="#22313f" stroke-width="1.3"/><circle cx="171" cy="120" r="9" fill="#7fb3e6" stroke="#22313f" stroke-width="1.3"/><circle cx="193" cy="120" r="9" fill="#7fb3e6" stroke="#22313f" stroke-width="1.3"/><circle cx="215" cy="120" r="9" fill="#7fb3e6" stroke="#22313f" stroke-width="1.3"/><text x="160.0" y="150.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >(6 C)</text>
<line x1="250.0" y1="120.0" x2="420.0" y2="120.0" stroke="#22313f" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fk)"/><text x="335.0" y="100.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c0392b" >fase de inversión</text>
<rect x="298.25" y="136" width="73.5" height="28" rx="14" fill="#fde8e6" stroke="#c0392b" stroke-width="2"/><text x="335.0" y="155.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c0392b" >− 2 ATP</text>
<text x="500.0" y="90.0" font-size="16" text-anchor="middle" font-weight="900" fill="#0f4c81" >2 triosas</text>
<circle cx="478" cy="120" r="9" fill="#7fb3e6" stroke="#22313f" stroke-width="1.3"/><circle cx="500" cy="120" r="9" fill="#7fb3e6" stroke="#22313f" stroke-width="1.3"/><circle cx="522" cy="120" r="9" fill="#7fb3e6" stroke="#22313f" stroke-width="1.3"/><circle cx="478" cy="150" r="9" fill="#7fb3e6" stroke="#22313f" stroke-width="1.3"/><circle cx="500" cy="150" r="9" fill="#7fb3e6" stroke="#22313f" stroke-width="1.3"/><circle cx="522" cy="150" r="9" fill="#7fb3e6" stroke="#22313f" stroke-width="1.3"/><text x="500.0" y="180.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >(2 × 3 C)</text>
<line x1="580.0" y1="135.0" x2="750.0" y2="135.0" stroke="#22313f" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fk)"/><text x="665.0" y="115.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >fase de beneficio</text>
<rect x="628.25" y="151" width="73.5" height="28" rx="14" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2"/><text x="665.0" y="170.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >+ 4 ATP</text>
<rect x="624.0" y="186" width="82.0" height="28" rx="14" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2"/><text x="665.0" y="205.0" font-size="13" text-anchor="middle" font-weight="900" fill="#6d3fc0" >+ 2 NADH</text>
<text x="840.0" y="90.0" font-size="18" text-anchor="middle" font-weight="900" fill="#0f4c81" >2 Piruvato</text>
<circle cx="818" cy="120" r="9" fill="#f4a261" stroke="#22313f" stroke-width="1.3"/><circle cx="840" cy="120" r="9" fill="#f4a261" stroke="#22313f" stroke-width="1.3"/><circle cx="862" cy="120" r="9" fill="#f4a261" stroke="#22313f" stroke-width="1.3"/><circle cx="818" cy="150" r="9" fill="#f4a261" stroke="#22313f" stroke-width="1.3"/><circle cx="840" cy="150" r="9" fill="#f4a261" stroke="#22313f" stroke-width="1.3"/><circle cx="862" cy="150" r="9" fill="#f4a261" stroke="#22313f" stroke-width="1.3"/><text x="840.0" y="180.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >(ácido pirúvico, 2 × 3 C)</text>
<rect x="120" y="250" width="760" height="110" rx="16" fill="#fff" stroke="#0f4c81" stroke-width="2.5"/><text x="500.0" y="282.0" font-size="16" text-anchor="middle" font-weight="900" fill="#0f4c81" >Glucosa + 2 NAD⁺ + 2 ADP + 2 Pi  →  2 Piruvato + 2 NADH + 2 H⁺ + 2 ATP + 2 H₂O</text>
<text x="500.0" y="312.0" font-size="14" text-anchor="middle" font-weight="800" fill="#22313f" >Balance neto: 2 ATP (por fosforilación a nivel de sustrato) y 2 NADH</text>
<text x="500.0" y="338.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >No necesita oxígeno: ocurre en condiciones aerobias y anaerobias, en todas las células</text>
</svg>
