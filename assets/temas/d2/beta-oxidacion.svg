<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Beta-oxidación de los ácidos grasos en la matriz mitocondrial</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="10" y="10" width="940" height="380" rx="20" fill="#fbe3d3" stroke="#b5532c" stroke-width="3"/><text x="30.0" y="40.0" font-size="15" text-anchor="start" font-weight="900" fill="#b5532c" >MATRIZ MITOCONDRIAL</text>
<text x="170.0" y="80.0" font-size="15" text-anchor="middle" font-weight="900" fill="#0f4c81" >Ácido graso activado</text>
<text x="170.0" y="98.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >(acil-CoA, n C)</text>
<circle cx="93" cy="130" r="9" fill="#f4d06f" stroke="#22313f" stroke-width="1.3"/><circle cx="115" cy="130" r="9" fill="#f4d06f" stroke="#22313f" stroke-width="1.3"/><circle cx="137" cy="130" r="9" fill="#f4d06f" stroke="#22313f" stroke-width="1.3"/><circle cx="159" cy="130" r="9" fill="#f4d06f" stroke="#22313f" stroke-width="1.3"/><circle cx="181" cy="130" r="9" fill="#f4d06f" stroke="#22313f" stroke-width="1.3"/><circle cx="203" cy="130" r="9" fill="#f4d06f" stroke="#22313f" stroke-width="1.3"/><circle cx="225" cy="130" r="9" fill="#f4d06f" stroke="#22313f" stroke-width="1.3"/><circle cx="247" cy="130" r="9" fill="#f4d06f" stroke="#22313f" stroke-width="1.3"/><rect x="262" y="120" width="40" height="22" rx="6" fill="#e3eef8" stroke="#0f4c81"/><text x="282.0" y="136.0" font-size="11" text-anchor="middle" font-weight="900" fill="#0f4c81" >CoA</text>
<line x1="330.0" y1="130.0" x2="470.0" y2="130.0" stroke="#c77d00" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fk)"/><text x="400.0" y="112.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c77d00" >una vuelta</text>
<text x="400.0" y="160.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >(4 reacciones)</text>
<circle cx="545" cy="110" r="9" fill="#f4d06f" stroke="#22313f" stroke-width="1.3"/><circle cx="567" cy="110" r="9" fill="#f4d06f" stroke="#22313f" stroke-width="1.3"/><circle cx="589" cy="110" r="9" fill="#f4d06f" stroke="#22313f" stroke-width="1.3"/><circle cx="611" cy="110" r="9" fill="#f4d06f" stroke="#22313f" stroke-width="1.3"/><circle cx="633" cy="110" r="9" fill="#f4d06f" stroke="#22313f" stroke-width="1.3"/><circle cx="655" cy="110" r="9" fill="#f4d06f" stroke="#22313f" stroke-width="1.3"/><rect x="670" y="100" width="40" height="22" rx="6" fill="#e3eef8" stroke="#0f4c81"/><text x="690.0" y="116.0" font-size="11" text-anchor="middle" font-weight="900" fill="#0f4c81" >CoA</text>
<text x="600.0" y="90.0" font-size="13" text-anchor="middle" font-weight="900" fill="#0f4c81" >acil-CoA con 2 C menos</text>
<circle cx="549" cy="170" r="9" fill="#f4d06f" stroke="#22313f" stroke-width="1.3"/><circle cx="571" cy="170" r="9" fill="#f4d06f" stroke="#22313f" stroke-width="1.3"/><rect x="586" y="160" width="40" height="22" rx="6" fill="#e3eef8" stroke="#0f4c81"/><text x="606.0" y="176.0" font-size="11" text-anchor="middle" font-weight="900" fill="#0f4c81" >CoA</text>
<text x="560.0" y="206.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c0392b" >acetil-CoA → ciclo de Krebs</text>
<rect x="807.5" y="96" width="65.0" height="28" rx="14" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2"/><text x="840.0" y="115.0" font-size="13" text-anchor="middle" font-weight="900" fill="#6d3fc0" >1 NADH</text>
<rect x="803.25" y="136" width="73.5" height="28" rx="14" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2"/><text x="840.0" y="155.0" font-size="13" text-anchor="middle" font-weight="900" fill="#6d3fc0" >1 FADH₂</text>
<path d="M660,140 C720,280 330,290 220,165" fill="none" stroke="#c77d00" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#fk)"/><text x="560.0" y="300.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c77d00" >se repite hasta que todo el ácido graso se convierte en acetil-CoA</text>
<rect x="60" y="320" width="840" height="56" rx="14" fill="#fff" stroke="#0f4c81" stroke-width="2"/><text x="480.0" y="344.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#0f4c81" >Ácido graso de n carbonos (par): n/2 acetil-CoA, en (n/2 − 1) vueltas, con 1 NADH y 1 FADH₂ por vuelta</text>
<text x="480.0" y="366.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >Ejemplo: palmítico (16 C) → 8 acetil-CoA en 7 vueltas: 7 NADH + 7 FADH₂</text>
</svg>
