<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Esquema de un fermentador industrial</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="366" y="180" width="288" height="270" rx="30" fill="#e7f1fb" stroke="#0f4c81" stroke-width="2" stroke-dasharray="7 5"/><rect x="380" y="140" width="260" height="330" rx="34" fill="#fff" stroke="#22313f" stroke-width="4"/><rect x="384" y="230" width="252" height="236" rx="30" fill="#fbe9c8"/><path d="M384,230 h252" stroke="#c77d00" stroke-width="2"/><rect x="480.0" y="90" width="60" height="36" rx="6" fill="#dfe6ec" stroke="#22313f" stroke-width="2.5"/><text x="510.0" y="113.0" font-size="12" text-anchor="middle" font-weight="800" fill="#22313f" >motor</text>
<line x1="510.0" y1="126.0" x2="510.0" y2="420.0" stroke="#22313f" stroke-width="4" stroke-linecap="round" /><rect x="462.0" y="293" width="96" height="14" rx="4" fill="#4c5b67"/><rect x="462.0" y="383" width="96" height="14" rx="4" fill="#4c5b67"/><circle cx="430.0" cy="400" r="4" fill="#fff" stroke="#0f4c81" stroke-width="1.5"/><circle cx="450.0" cy="360" r="5" fill="#fff" stroke="#0f4c81" stroke-width="1.5"/><circle cx="580.0" cy="410" r="6" fill="#fff" stroke="#0f4c81" stroke-width="1.5"/><circle cx="600.0" cy="340" r="4" fill="#fff" stroke="#0f4c81" stroke-width="1.5"/><circle cx="420.0" cy="300" r="5" fill="#fff" stroke="#0f4c81" stroke-width="1.5"/><circle cx="570.0" cy="280" r="6" fill="#fff" stroke="#0f4c81" stroke-width="1.5"/><circle cx="480.0" cy="440" r="4" fill="#fff" stroke="#0f4c81" stroke-width="1.5"/><circle cx="540.0" cy="330" r="5" fill="#fff" stroke="#0f4c81" stroke-width="1.5"/><rect x="451.0" y="256" width="18" height="8" rx="4" fill="#2a9d8f"/><rect x="541.0" y="366" width="18" height="8" rx="4" fill="#2a9d8f"/><rect x="406.0" y="426" width="18" height="8" rx="4" fill="#2a9d8f"/><rect x="596.0" y="436" width="18" height="8" rx="4" fill="#2a9d8f"/><rect x="511.0" y="256" width="18" height="8" rx="4" fill="#2a9d8f"/><rect x="481.0" y="341" width="18" height="8" rx="4" fill="#2a9d8f"/><line x1="350.0" y1="450.0" x2="490.0" y2="450.0" stroke="#0f4c81" stroke-width="3" stroke-linecap="round" /><line x1="180.0" y1="450.0" x2="410.0" y2="450.0" stroke="#0f4c81" stroke-width="3" stroke-linecap="round" marker-end="url(#fk)"/><text x="175.0" y="436.0" font-size="14" text-anchor="start" font-weight="900" fill="#0f4c81" >aire estéril (O₂)</text>
<text x="175.0" y="472.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >si el proceso es aerobio</text>
<line x1="180.0" y1="180.0" x2="420.0" y2="180.0" stroke="#3f8a3a" stroke-width="3" stroke-linecap="round" marker-end="url(#fk)"/><text x="175.0" y="166.0" font-size="14" text-anchor="start" font-weight="900" fill="#3f8a3a" >medio de cultivo estéril</text>
<text x="175.0" y="202.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >+ inóculo del microorganismo</text>
<line x1="590.0" y1="144.0" x2="590.0" y2="90.0" stroke="#4c5b67" stroke-width="3" stroke-linecap="round" marker-end="url(#fk)"/><text x="600.0" y="100.0" font-size="13" text-anchor="start" font-weight="900" fill="#4c5b67" >gases (CO₂)</text>
<line x1="570.0" y1="146.0" x2="570.0" y2="280.0" stroke="#c0392b" stroke-width="3" stroke-linecap="round" /><circle cx="570" cy="284" r="5" fill="#c0392b"/><line x1="598.0" y1="146.0" x2="598.0" y2="280.0" stroke="#6d3fc0" stroke-width="3" stroke-linecap="round" /><circle cx="598" cy="284" r="5" fill="#6d3fc0"/><line x1="626.0" y1="146.0" x2="626.0" y2="280.0" stroke="#0f4c81" stroke-width="3" stroke-linecap="round" /><circle cx="626" cy="284" r="5" fill="#0f4c81"/><text x="670.0" y="260.0" font-size="13" text-anchor="start" font-weight="800" fill="#22313f" >sensores: temperatura,</text>
<text x="670.0" y="278.0" font-size="13" text-anchor="start" font-weight="800" fill="#22313f" >pH, oxígeno, espuma</text>
<text x="670.0" y="340.0" font-size="13" text-anchor="start" font-weight="900" fill="#0f4c81" >camisa de refrigeración</text>
<text x="670.0" y="358.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >(mantiene la temperatura</text>
<text x="670.0" y="374.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >óptima)</text>
<line x1="510.0" y1="470.0" x2="510.0" y2="536.0" stroke="#c77d00" stroke-width="3" stroke-linecap="round" /><rect x="595.0" y="512.0" width="250" height="48" rx="12" fill="#fff4df" stroke="#c77d00" stroke-width="2.5"/><text x="720.0" y="540.9" font-size="14" text-anchor="middle" font-weight="900" fill="#c77d00" >Separación y purificación</text>
<line x1="510.0" y1="536.0" x2="592.0" y2="536.0" stroke="#c77d00" stroke-width="3" stroke-linecap="round" marker-end="url(#fk)"/><line x1="846.0" y1="536.0" x2="896.0" y2="536.0" stroke="#c77d00" stroke-width="3" stroke-linecap="round" marker-end="url(#fk)"/><text x="902.0" y="530.0" font-size="15" text-anchor="start" font-weight="900" fill="#c77d00" >PRODUCTO</text>
<text x="902.0" y="550.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >antibiótico, insulina, enzima…</text>
<text x="560.0" y="34.0" font-size="15" text-anchor="middle" font-weight="900" fill="#0f4c81" >FERMENTADOR o BIORREACTOR: cultivo a gran escala en condiciones controladas y estériles</text>
</svg>
