<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 250" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Microorganismos en la mejora del medio ambiente</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="10" y="10" width="250" height="230" rx="16" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2.5"/><text x="135.0" y="42.0" font-size="17" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Biorremediación</text>
<text x="135.0" y="80.0" font-size="13.5" text-anchor="middle" font-weight="800" fill="#22313f" >Microorganismos que degradan</text>
<text x="135.0" y="110.0" font-size="13.5" text-anchor="middle" font-weight="800" fill="#22313f" >contaminantes: hidrocarburos</text>
<text x="135.0" y="140.0" font-size="13.5" text-anchor="middle" font-weight="800" fill="#22313f" >(mareas negras), insecticidas,</text>
<text x="135.0" y="170.0" font-size="13.5" text-anchor="middle" font-weight="800" fill="#22313f" >disolventes…</text>
<text x="135.0" y="200.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#3f8a3a" >→ recuperan el ecosistema</text>
<rect x="272" y="10" width="250" height="230" rx="16" fill="#fff4df" stroke="#c77d00" stroke-width="2.5"/><text x="397.0" y="42.0" font-size="17" text-anchor="middle" font-weight="900" fill="#c77d00" >Compostaje</text>
<text x="397.0" y="80.0" font-size="13.5" text-anchor="middle" font-weight="800" fill="#22313f" >Restos orgánicos (poda,</text>
<text x="397.0" y="110.0" font-size="13.5" text-anchor="middle" font-weight="800" fill="#22313f" >estiércol, residuos de cosecha)</text>
<text x="397.0" y="140.0" font-size="13.5" text-anchor="middle" font-weight="800" fill="#22313f" >degradados por bacterias y</text>
<text x="397.0" y="170.0" font-size="13.5" text-anchor="middle" font-weight="800" fill="#22313f" >hongos en presencia de O₂</text>
<text x="397.0" y="200.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#c77d00" >→ compost (abono)</text>
<rect x="534" y="10" width="250" height="230" rx="16" fill="#e3eef8" stroke="#0f4c81" stroke-width="2.5"/><text x="659.0" y="42.0" font-size="17" text-anchor="middle" font-weight="900" fill="#0f4c81" >Biolixiviación</text>
<text x="659.0" y="80.0" font-size="13.5" text-anchor="middle" font-weight="800" fill="#22313f" >Bacterias quimiosintéticas</text>
<text x="659.0" y="110.0" font-size="13.5" text-anchor="middle" font-weight="800" fill="#22313f" >(Acidithiobacillus) oxidan</text>
<text x="659.0" y="140.0" font-size="13.5" text-anchor="middle" font-weight="800" fill="#22313f" >sulfuros del mineral y liberan</text>
<text x="659.0" y="170.0" font-size="13.5" text-anchor="middle" font-weight="800" fill="#22313f" >metales (cobre) en disolución</text>
<text x="659.0" y="200.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#0f4c81" >→ aprovecha minerales pobres</text>
<rect x="796" y="10" width="250" height="230" rx="16" fill="#e0f3f1" stroke="#2a9d8f" stroke-width="2.5"/><text x="921.0" y="42.0" font-size="17" text-anchor="middle" font-weight="900" fill="#2a9d8f" >Fijación de N₂</text>
<text x="921.0" y="80.0" font-size="13.5" text-anchor="middle" font-weight="800" fill="#22313f" >Rhizobium en nódulos de las</text>
<text x="921.0" y="110.0" font-size="13.5" text-anchor="middle" font-weight="800" fill="#22313f" >raíces de leguminosas:</text>
<text x="921.0" y="140.0" font-size="13.5" text-anchor="middle" font-weight="800" fill="#22313f" >N₂ atmosférico → amonio</text>
<text x="921.0" y="170.0" font-size="13.5" text-anchor="middle" font-weight="800" fill="#22313f" >que usa la planta</text>
<text x="921.0" y="200.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#2a9d8f" >→ menos abonos químicos</text>
</svg>
