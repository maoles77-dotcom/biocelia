<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Dianas de los antibióticos en la célula bacteriana</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="140" y="140" width="440" height="220" rx="110" fill="none" stroke="#c77d00" stroke-width="10"/><rect x="154" y="154" width="412" height="192" rx="96" fill="#eef8f6" stroke="#2a9d8f" stroke-width="3"/><path d="M240,240 q20,-40 50,-6 t60,10 t50,-14 t40,20" fill="none" stroke="#22313f" stroke-width="3"/><circle cx="470" cy="300" r="16" fill="none" stroke="#22313f" stroke-width="2.5"/><circle cx="210" cy="300" r="5" fill="#6d3fc0"/><circle cx="230" cy="310" r="5" fill="#6d3fc0"/><circle cx="250" cy="300" r="5" fill="#6d3fc0"/><circle cx="270" cy="310" r="5" fill="#6d3fc0"/><circle cx="290" cy="300" r="5" fill="#6d3fc0"/><circle cx="310" cy="310" r="5" fill="#6d3fc0"/><circle cx="330" cy="300" r="5" fill="#6d3fc0"/><circle cx="350" cy="310" r="5" fill="#6d3fc0"/><circle cx="370" cy="300" r="5" fill="#6d3fc0"/><line x1="170.0" y1="180.0" x2="140.0" y2="118.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><text x="140.0" y="92.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#c77d00" >PARED (peptidoglucano)</text>
<text x="140.0" y="110.0" font-size="13" text-anchor="middle" font-weight="800" fill="#22313f" >penicilina, cefalosporinas</text>
<line x1="240.0" y1="308.0" x2="180.0" y2="400.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><text x="180.0" y="418.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#6d3fc0" >RIBOSOMAS 70S (síntesis de proteínas)</text>
<text x="180.0" y="436.0" font-size="13" text-anchor="middle" font-weight="800" fill="#22313f" >estreptomicina, tetraciclina, cloranfenicol</text>
<line x1="320.0" y1="220.0" x2="400.0" y2="100.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><text x="400.0" y="74.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#22313f" >ADN (replicación)</text>
<text x="400.0" y="92.0" font-size="13" text-anchor="middle" font-weight="800" fill="#22313f" >quinolonas</text>
<line x1="540.0" y1="190.0" x2="560.0" y2="138.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><text x="560.0" y="112.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#2a9d8f" >MEMBRANA</text>
<text x="560.0" y="130.0" font-size="13" text-anchor="middle" font-weight="800" fill="#22313f" >polimixinas, gramicidinas</text>
<line x1="480.0" y1="314.0" x2="530.0" y2="400.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" /><text x="560.0" y="418.0" font-size="13" text-anchor="middle" font-weight="800" fill="#22313f" >plásmido: puede llevar</text>
<text x="560.0" y="436.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c0392b" >genes de resistencia</text>
<rect x="700" y="60" width="360" height="370" rx="16" fill="#fff" stroke="#0f4c81" stroke-width="2.5"/><text x="880.0" y="90.0" font-size="15" text-anchor="middle" font-weight="900" fill="#0f4c81" >¿Por qué no dañan a nuestras células?</text>
<text x="722.0" y="126.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Las células eucariotas no tienen</text>
<text x="722.0" y="151.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >  pared de peptidoglucano.</text>
<text x="722.0" y="176.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Sus ribosomas son 80S, no 70S.</text>
<text x="722.0" y="201.0" font-size="14" text-anchor="start" font-weight="800" fill="#6d3fc0" >  (Ojo: las mitocondrias tienen 70S)</text>
<text x="722.0" y="251.0" font-size="15" text-anchor="start" font-weight="900" fill="#c0392b" >¿Y contra los virus?</text>
<text x="722.0" y="276.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• No sirven: los virus no tienen</text>
<text x="722.0" y="301.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >  pared, ni ribosomas, ni metabolismo</text>
<text x="722.0" y="326.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >  propio. Se usan antivirales.</text>
<text x="722.0" y="376.0" font-size="14" text-anchor="start" font-weight="800" fill="#c77d00" >Origen: hongos (Penicillium) y</text>
<text x="722.0" y="401.0" font-size="14" text-anchor="start" font-weight="800" fill="#c77d00" >bacterias (Streptomyces).</text>
</svg>
