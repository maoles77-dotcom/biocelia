<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Síntesis de ácidos grasos en el citosol frente a beta-oxidación en la mitocondria</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="10" y="10" width="480" height="300" rx="18" fill="#fdf3e7" stroke="#2a7fc1" stroke-width="2.5"/><text x="250.0" y="40.0" font-size="15" text-anchor="middle" font-weight="900" fill="#3f8a3a" >SÍNTESIS (anabolismo) · CITOSOL</text>
<rect x="160.0" y="67.0" width="180" height="46" rx="12" fill="#fff" stroke="#22313f" stroke-width="2.5"/><text x="250.0" y="95.2" font-size="15" text-anchor="middle" font-weight="900" fill="#22313f" >Acetil-CoA</text>
<line x1="250.0" y1="114.0" x2="250.0" y2="196.0" stroke="#3f8a3a" stroke-width="4" stroke-linecap="round" marker-end="url(#fk)"/><rect x="66.72999999999999" y="136" width="86.54" height="28" rx="14" fill="#fff4df" stroke="#c77d00" stroke-width="2"/><text x="110.0" y="155.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c77d00" >gasta ATP</text>
<rect x="338.67" y="136" width="102.66" height="28" rx="14" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2"/><text x="390.0" y="155.0" font-size="13" text-anchor="middle" font-weight="900" fill="#6d3fc0" >gasta NADPH</text>
<rect x="150.0" y="199.0" width="200" height="46" rx="12" fill="#e3eef8" stroke="#0f4c81" stroke-width="2.5"/><text x="250.0" y="227.2" font-size="15" text-anchor="middle" font-weight="900" fill="#0f4c81" >Ácido graso</text>
<text x="250.0" y="270.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >se añaden unidades de 2 C (complejo ácido graso sintasa)</text>
<text x="250.0" y="292.0" font-size="12" text-anchor="middle" font-weight="900" fill="#3f8a3a" >→ con glicerina forma triglicéridos (REL)</text>
<rect x="510" y="10" width="480" height="300" rx="18" fill="#fbe3d3" stroke="#b5532c" stroke-width="2.5"/><text x="750.0" y="40.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c0392b" >DEGRADACIÓN (catabolismo) · MITOCONDRIA</text>
<rect x="650.0" y="67.0" width="200" height="46" rx="12" fill="#e3eef8" stroke="#0f4c81" stroke-width="2.5"/><text x="750.0" y="95.2" font-size="15" text-anchor="middle" font-weight="900" fill="#0f4c81" >Ácido graso</text>
<line x1="750.0" y1="114.0" x2="750.0" y2="196.0" stroke="#c0392b" stroke-width="4" stroke-linecap="round" marker-end="url(#fk)"/><text x="760.0" y="160.0" font-size="14" text-anchor="start" font-weight="900" fill="#c0392b" >β-oxidación</text>
<rect x="564.64" y="136" width="110.72" height="28" rx="14" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2"/><text x="620.0" y="155.0" font-size="13" text-anchor="middle" font-weight="900" fill="#6d3fc0" >produce NADH</text>
<rect x="584.79" y="172" width="70.42" height="28" rx="14" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2"/><text x="620.0" y="191.0" font-size="13" text-anchor="middle" font-weight="900" fill="#6d3fc0" >y FADH₂</text>
<rect x="660.0" y="199.0" width="180" height="46" rx="12" fill="#fff" stroke="#22313f" stroke-width="2.5"/><text x="750.0" y="227.2" font-size="15" text-anchor="middle" font-weight="900" fill="#22313f" >Acetil-CoA</text>
<text x="750.0" y="270.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >se separan unidades de 2 C</text>
<text x="750.0" y="292.0" font-size="12" text-anchor="middle" font-weight="900" fill="#c0392b" >→ ciclo de Krebs</text>
<text x="500.0" y="340.0" font-size="14" text-anchor="middle" font-weight="900" fill="#0f4c81" >Rutas opuestas con enzimas y compartimentos distintos: así se regulan por separado.</text>
</svg>
