<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 335" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>El hígado crudo descompone el agua oxigenada con burbujas por la catalasa; hervido, no</title>
