<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Perfil de energía de una reacción con y sin enzima: la enzima baja la energía de activación sin cambiar la energía liberada</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<line x1="80" y1="310" x2="640" y2="310" stroke="#22313f" stroke-width="2.5" marker-end="url(#fk)"/><line x1="80" y1="310" x2="80" y2="22" stroke="#22313f" stroke-width="2.5" marker-end="url(#fk)"/><text x="640.0" y="334.0" font-size="14" text-anchor="end" font-weight="800" fill="#22313f" >transcurso de la reacción</text>
<text x="64" y="170.0" font-size="14" font-weight="800" fill="#22313f" text-anchor="middle" transform="rotate(-90 64 170.0)" font-family="Nunito, Segoe UI, sans-serif">energía</text><path d="M90,160 H150 C240,160 310,40 360,40 C410,40 480,250 570,250 H630" fill="none" stroke="#c0392b" stroke-width="4"/><path d="M90,160 H150 C240,160 310,115 360,115 C410,115 480,250 570,250 H630" fill="none" stroke="#3f8a3a" stroke-width="4" stroke-dasharray="10 6"/><line x1="352" y1="160" x2="352" y2="44" stroke="#c0392b" stroke-width="2.5" marker-start="url(#fk)" marker-end="url(#fk)"/><line x1="378" y1="160" x2="378" y2="119" stroke="#3f8a3a" stroke-width="2.5" marker-start="url(#fk)" marker-end="url(#fk)"/><text x="342.0" y="90.0" font-size="14" text-anchor="end" font-weight="900" fill="#c0392b" style="paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round">Ea sin enzima</text>
<text x="386.0" y="148.0" font-size="14" text-anchor="start" font-weight="900" fill="#3f8a3a" style="paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round">Ea con enzima</text>
<line x1="100" y1="160" x2="610" y2="160" stroke="#4c5b67" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="600" y1="160" x2="600" y2="250" stroke="#0f4c81" stroke-width="2.5" marker-start="url(#fk)" marker-end="url(#fk)"/><text x="608.0" y="210.0" font-size="13" text-anchor="start" font-weight="900" fill="#0f4c81" >energía liberada</text>
<text x="608.0" y="227.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >(igual en los dos casos)</text>
<text x="140.0" y="148.0" font-size="14" text-anchor="middle" font-weight="900" fill="#22313f" >sustratos</text>
<text x="570.0" y="276.0" font-size="14" text-anchor="middle" font-weight="900" fill="#22313f" >productos</text>
<line x1="440" y1="350" x2="470" y2="350" stroke="#c0392b" stroke-width="4"/><text x="476.0" y="355.0" font-size="13" text-anchor="start" font-weight="800" fill="#22313f" >sin enzima</text>
<line x1="560" y1="350" x2="590" y2="350" stroke="#3f8a3a" stroke-width="4" stroke-dasharray="10 6"/><text x="596.0" y="355.0" font-size="13" text-anchor="start" font-weight="800" fill="#22313f" >con enzima</text>
</svg>
