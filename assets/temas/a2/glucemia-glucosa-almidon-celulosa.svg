<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Subida de la glucemia tras ingerir glucosa, almidón o celulosa</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<line x1="80" y1="250" x2="600" y2="250" stroke="#22313f" stroke-width="2.5" marker-end="url(#fk)"/><line x1="80" y1="250" x2="80" y2="20" stroke="#22313f" stroke-width="2.5" marker-end="url(#fk)"/><text x="600.0" y="274.0" font-size="14" text-anchor="end" font-weight="800" fill="#22313f" >tiempo tras la ingesta</text>
<text x="30" y="140.0" font-size="14" font-weight="800" fill="#22313f" transform="rotate(-90 30 140.0)" text-anchor="middle" font-family="Nunito, Segoe UI, sans-serif">glucosa en sangre</text><path d="M80,210 C135.0,210 146.0,50 190,50 S256.0,210 580,210" fill="none" stroke="#c0392b" stroke-width="3.5"/><path d="M80,210 C190.0,210 212.0,110 300,110 S432.0,210 580,210" fill="none" stroke="#c77d00" stroke-width="3.5"/><line x1="80" y1="210" x2="580" y2="210" stroke="#3f8a3a" stroke-width="3.5" stroke-dasharray="9 6"/><text x="200.0" y="40.0" font-size="14" text-anchor="start" font-weight="900" fill="#c0392b" >glucosa: se absorbe directamente</text>
<text x="325.0" y="104.0" font-size="14" text-anchor="start" font-weight="900" fill="#8a5600" >almidón: antes hay que hidrolizarlo</text>
<text x="580.0" y="232.0" font-size="14" text-anchor="end" font-weight="900" fill="#3f8a3a" >celulosa: no la digerimos</text>
<text x="340.0" y="300.0" font-size="12" text-anchor="middle" font-weight="700" fill="#4c5b67" >Esquema cualitativo (sin valores), según los criterios de la PAU 2013.</text>
</svg>
