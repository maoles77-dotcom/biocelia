<text x="600.0" y="231.0" font-size="12" text-anchor="middle" font-weight="700" fill="#4c5b67" >solo monosacáridos</text>
<rect x="780.0" y="190" width="240" height="48" rx="12" fill="#fff4df" stroke="#c77d00" stroke-width="2"/><text x="900.0" y="214.0" font-size="16" text-anchor="middle" font-weight="900" fill="#c77d00" >Heterósidos</text>
