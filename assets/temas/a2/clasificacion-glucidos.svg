<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 365" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Clasificación de los glúcidos en monosacáridos y ósidos</title>
