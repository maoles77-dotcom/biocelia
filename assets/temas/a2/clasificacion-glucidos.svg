<rect x="75.0" y="96" width="290" height="48" rx="12" fill="#e7f0f8" stroke="#0f4c81" stroke-width="2"/><text x="220.0" y="120.0" font-size="16" text-anchor="middle" font-weight="900" fill="#0f4c81" >Monosacáridos (osas)</text>
<text x="220.0" y="137.0" font-size="12" text-anchor="middle" font-weight="700" fill="#4c5b67" >no hidrolizables · 3-7 C</text>
<rect x="620.0" y="96" width="200" height="48" rx="12" fill="#e7f0f8" stroke="#0f4c81" stroke-width="2"/><text x="720.0" y="120.0" font-size="16" text-anchor="middle" font-weight="900" fill="#0f4c81" >Ósidos</text>
<text x="720.0" y="137.0" font-size="12" text-anchor="middle" font-weight="700" fill="#4c5b67" >hidrolizables</text>
