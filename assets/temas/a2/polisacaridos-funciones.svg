<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 268" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Dónde están y para qué sirven el almidón, el glucógeno, la celulosa y la quitina</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<ellipse cx="110" cy="95" rx="70" ry="48" fill="#d9b56f" stroke="#9a7330" stroke-width="2.5"/><circle cx="80" cy="80" r="3.5" fill="#9a7330"/><circle cx="130" cy="70" r="3.5" fill="#9a7330"/><circle cx="110" cy="115" r="3.5" fill="#9a7330"/><circle cx="150" cy="105" r="3.5" fill="#9a7330"/><text x="110.0" y="180.0" font-size="19" text-anchor="middle" font-weight="900" fill="#0f4c81" >Almidón</text>
<text x="110.0" y="200.0" font-size="14" text-anchor="middle" font-weight="700" fill="#4c5b67" >reserva en vegetales</text>
<text x="110.0" y="218.0" font-size="12" text-anchor="middle" font-weight="600" fill="#4c5b67" >(amiloplastos: tubérculos, semillas)</text>
<path d="M290,60 C350,40 420,50 430,80 C440,115 380,140 330,135 C300,130 270,100 290,60z" fill="#b5533c" stroke="#7e3424" stroke-width="2.5"/><text x="360.0" y="180.0" font-size="19" text-anchor="middle" font-weight="900" fill="#0f4c81" >Glucógeno</text>
<text x="360.0" y="200.0" font-size="14" text-anchor="middle" font-weight="700" fill="#4c5b67" >reserva en animales</text>
<text x="360.0" y="218.0" font-size="12" text-anchor="middle" font-weight="600" fill="#4c5b67" >(hígado y músculo)</text>
<rect x="550" y="45" width="130" height="95" rx="10" fill="#e3f4df" stroke="#3f8a3a" stroke-width="7"/><rect x="566" y="60" width="98" height="65" rx="8" fill="#b9e3b3"/><circle cx="615" cy="92" r="14" fill="#7aa86f"/><text x="615.0" y="180.0" font-size="19" text-anchor="middle" font-weight="900" fill="#0f4c81" >Celulosa</text>
<text x="615.0" y="200.0" font-size="14" text-anchor="middle" font-weight="700" fill="#4c5b67" >estructural</text>
<text x="615.0" y="218.0" font-size="12" text-anchor="middle" font-weight="600" fill="#4c5b67" >(pared de la célula vegetal)</text>
<ellipse cx="870" cy="100" rx="38" ry="50" fill="#3d5a3a" stroke="#1f3320" stroke-width="2.5"/><line x1="870" y1="52" x2="870" y2="150" stroke="#1f3320" stroke-width="2"/><circle cx="870" cy="50" r="15" fill="#3d5a3a"/><line x1="834" y1="80" x2="808" y2="92" stroke="#1f3320" stroke-width="3"/><line x1="834" y1="100" x2="808" y2="112" stroke="#1f3320" stroke-width="3"/><line x1="834" y1="120" x2="808" y2="132" stroke="#1f3320" stroke-width="3"/><line x1="906" y1="80" x2="932" y2="92" stroke="#1f3320" stroke-width="3"/><line x1="906" y1="100" x2="932" y2="112" stroke="#1f3320" stroke-width="3"/><line x1="906" y1="120" x2="932" y2="132" stroke="#1f3320" stroke-width="3"/><text x="870.0" y="180.0" font-size="19" text-anchor="middle" font-weight="900" fill="#0f4c81" >Quitina</text>
<text x="870.0" y="200.0" font-size="14" text-anchor="middle" font-weight="700" fill="#4c5b67" >estructural</text>
<text x="870.0" y="218.0" font-size="12" text-anchor="middle" font-weight="600" fill="#4c5b67" >(exoesqueleto de artrópodos, pared de hongos)</text>
<text x="240.0" y="252.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c77d00" >Enlaces α → reserva energética (se hidrolizan con facilidad)</text>
<text x="745.0" y="252.0" font-size="15" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Enlaces β → función estructural (fibras resistentes)</text>
</svg>
