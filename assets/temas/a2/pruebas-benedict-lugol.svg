<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Resultados de las pruebas de Benedict o Fehling y de Lugol</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<text x="175.0" y="20.0" font-size="15" text-anchor="middle" font-weight="900" fill="#0f4c81" >Benedict (o Fehling): azúcares reductores</text>
<path d="M58,40 V190 A22,22 0 0 0 102,190 V40" fill="#fff" stroke="#7b8a97" stroke-width="3"/><path d="M60,110 V190 A20,20 0 0 0 100,190 V110z" fill="#3b7dd8"/><rect x="53" y="32" width="54" height="10" rx="4" fill="#cfd8df"/><text x="80.0" y="240.0" font-size="15" text-anchor="middle" font-weight="900" fill="#22313f" >Negativo</text>
<text x="80.0" y="258.0" font-size="12" text-anchor="middle" font-weight="700" fill="#4c5b67" >sigue azul</text>
<path d="M228,40 V190 A22,22 0 0 0 272,190 V40" fill="#fff" stroke="#7b8a97" stroke-width="3"/><path d="M230,110 V190 A20,20 0 0 0 270,190 V110z" fill="#c0392b"/><rect x="223" y="32" width="54" height="10" rx="4" fill="#cfd8df"/><text x="250.0" y="240.0" font-size="15" text-anchor="middle" font-weight="900" fill="#22313f" >Positivo</text>
<text x="250.0" y="258.0" font-size="12" text-anchor="middle" font-weight="700" fill="#4c5b67" >rojo ladrillo</text>
<text x="165.0" y="290.0" font-size="13" text-anchor="middle" font-weight="800" fill="#22313f" >glucosa, fructosa, maltosa, lactosa: +</text>
<text x="165.0" y="308.0" font-size="13" text-anchor="middle" font-weight="800" fill="#22313f" >sacarosa y polisacáridos: −</text>
<line x1="355" y1="30" x2="355" y2="310" stroke="#dde5ec" stroke-width="2"/><text x="545.0" y="20.0" font-size="16" text-anchor="middle" font-weight="900" fill="#0f4c81" >Lugol: almidón</text>
<path d="M438,40 V190 A22,22 0 0 0 482,190 V40" fill="#fff" stroke="#7b8a97" stroke-width="3"/><path d="M440,110 V190 A20,20 0 0 0 480,190 V110z" fill="#d9a441"/><rect x="433" y="32" width="54" height="10" rx="4" fill="#cfd8df"/><text x="460.0" y="240.0" font-size="15" text-anchor="middle" font-weight="900" fill="#22313f" >Negativo</text>
<text x="460.0" y="258.0" font-size="12" text-anchor="middle" font-weight="700" fill="#4c5b67" >amarillo-pardo</text>
<path d="M608,40 V190 A22,22 0 0 0 652,190 V40" fill="#fff" stroke="#7b8a97" stroke-width="3"/><path d="M610,110 V190 A20,20 0 0 0 650,190 V110z" fill="#1f2a5a"/><rect x="603" y="32" width="54" height="10" rx="4" fill="#cfd8df"/><text x="630.0" y="240.0" font-size="15" text-anchor="middle" font-weight="900" fill="#22313f" >Positivo</text>
<text x="630.0" y="258.0" font-size="12" text-anchor="middle" font-weight="700" fill="#4c5b67" >azul-negro</text>
<text x="545.0" y="290.0" font-size="13" text-anchor="middle" font-weight="800" fill="#22313f" >el yodo se aloja en la hélice de la amilosa</text>
</svg>
