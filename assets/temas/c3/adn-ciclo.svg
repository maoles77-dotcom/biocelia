<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Variación de la cantidad de ADN a lo largo del ciclo celular</title>
