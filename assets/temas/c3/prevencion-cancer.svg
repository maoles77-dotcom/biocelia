<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 365" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Agentes cancerígenos y medidas de prevención del cáncer</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="10" y="10" width="330" height="230" rx="16" fill="#e3eef8" stroke="#0f4c81" stroke-width="2.5"/><text x="175.0" y="42.0" font-size="19" text-anchor="middle" font-weight="900" fill="#0f4c81" >Agentes físicos</text>
<text x="34.0" y="80.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Radiación UV (sol, cabinas)</text>
<text x="34.0" y="106.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Rayos X y γ, radón</text>
<rect x="26" y="176" width="298" height="46" rx="12" fill="#fff" stroke="#0f4c81"/><text x="175.0" y="205.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#0f4c81" >✓ Protección solar, evitar quemaduras</text>
<rect x="350" y="10" width="330" height="230" rx="16" fill="#fff4df" stroke="#c77d00" stroke-width="2.5"/><text x="515.0" y="42.0" font-size="19" text-anchor="middle" font-weight="900" fill="#c77d00" >Agentes químicos</text>
<text x="374.0" y="80.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Tabaco (benzopireno…)</text>
<text x="374.0" y="106.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Alcohol, amianto</text>
<text x="374.0" y="132.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Aflatoxinas, contaminantes</text>
<rect x="366" y="176" width="298" height="46" rx="12" fill="#fff" stroke="#c77d00"/><text x="515.0" y="205.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#c77d00" >✓ No fumar, menos alcohol</text>
<rect x="690" y="10" width="330" height="230" rx="16" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2.5"/><text x="855.0" y="42.0" font-size="19" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Agentes biológicos</text>
<text x="714.0" y="80.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Virus del papiloma (VPH)</text>
<text x="714.0" y="106.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Virus de las hepatitis B y C</text>
<text x="714.0" y="132.0" font-size="14" text-anchor="start" font-weight="800" fill="#22313f" >• Helicobacter pylori</text>
<rect x="706" y="176" width="298" height="46" rx="12" fill="#fff" stroke="#3f8a3a"/><text x="855.0" y="205.0" font-size="13.5" text-anchor="middle" font-weight="900" fill="#3f8a3a" >✓ Vacunas (VPH, hepatitis B)</text>
<rect x="10" y="256" width="1010" height="96" rx="16" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2.5"/><text x="515.0" y="284.0" font-size="17" text-anchor="middle" font-weight="900" fill="#6d3fc0" >Hábitos de vida saludables</text>
<text x="30.0" y="322.0" font-size="13.5" text-anchor="start" font-weight="800" fill="#22313f" >✓ Dieta rica en fruta, verdura y fibra</text>
<text x="365.0" y="322.0" font-size="13.5" text-anchor="start" font-weight="800" fill="#22313f" >✓ Actividad física y peso saludable</text>
<text x="700.0" y="322.0" font-size="13.5" text-anchor="start" font-weight="800" fill="#22313f" >✓ Cribados: mama, colon, cuello de útero</text>
</svg>
