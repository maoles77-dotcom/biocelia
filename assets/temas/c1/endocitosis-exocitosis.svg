<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Tipos de endocitosis y exocitosis</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="15" y="20" width="250" height="330" rx="16" fill="#f6f9fb" stroke="#d5dde3"/><text x="140.0" y="50.0" font-size="17" text-anchor="middle" font-weight="900" fill="#0f4c81" >Fagocitosis</text>
<text x="140.0" y="300.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >partículas grandes,</text>
<text x="140.0" y="318.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >microorganismos</text>
<rect x="285" y="20" width="250" height="330" rx="16" fill="#fff" stroke="#d5dde3"/><text x="410.0" y="50.0" font-size="17" text-anchor="middle" font-weight="900" fill="#0f4c81" >Pinocitosis</text>
<text x="410.0" y="300.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >líquido con</text>
<text x="410.0" y="318.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >solutos</text>
<rect x="555" y="20" width="250" height="330" rx="16" fill="#f6f9fb" stroke="#d5dde3"/><text x="680.0" y="50.0" font-size="17" text-anchor="middle" font-weight="900" fill="#0f4c81" >Mediada por receptor</text>
<text x="680.0" y="300.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >moléculas concretas</text>
<text x="680.0" y="318.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >(p. ej., colesterol-LDL)</text>
<rect x="825" y="20" width="250" height="330" rx="16" fill="#fff" stroke="#d5dde3"/><text x="950.0" y="50.0" font-size="17" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Exocitosis</text>
<text x="950.0" y="300.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >secreción al</text>
<text x="950.0" y="318.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >exterior</text>
<path d="M30,140 L80,140 C70,90 110,70 140,100 C170,70 210,90 200,140 L250,140" fill="none" stroke="#2a7fc1" stroke-width="4"/><rect x="120" y="100" width="40" height="22" rx="11" fill="#8ab17d" stroke="#3f8a3a" stroke-width="2"/><circle cx="140" cy="220" r="30" fill="#fff" stroke="#2a7fc1" stroke-width="3"/><rect x="122" y="210" width="36" height="20" rx="10" fill="#8ab17d" stroke="#3f8a3a" stroke-width="2"/><line x1="140.0" y1="150.0" x2="140.0" y2="184.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><text x="140.0" y="270.0" font-size="13" text-anchor="middle" font-weight="900" fill="#22313f" >fagosoma</text>
<path d="M300,140 L386,140 C386,180 434,180 434,140 L520,140" fill="none" stroke="#2a7fc1" stroke-width="4"/><circle cx="396" cy="150" r="2.5" fill="#0f4c81"/><circle cx="403" cy="156" r="2.5" fill="#0f4c81"/><circle cx="410" cy="150" r="2.5" fill="#0f4c81"/><circle cx="417" cy="156" r="2.5" fill="#0f4c81"/><circle cx="424" cy="150" r="2.5" fill="#0f4c81"/><circle cx="410" cy="225" r="18" fill="#e3f2fd" stroke="#2a7fc1" stroke-width="3"/><circle cx="402" cy="224" r="2.3" fill="#0f4c81"/><circle cx="408" cy="229" r="2.3" fill="#0f4c81"/><circle cx="414" cy="224" r="2.3" fill="#0f4c81"/><circle cx="420" cy="229" r="2.3" fill="#0f4c81"/><line x1="410.0" y1="172.0" x2="410.0" y2="202.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><text x="410.0" y="270.0" font-size="13" text-anchor="middle" font-weight="900" fill="#22313f" >vesícula de pinocitosis</text>
<path d="M570,140 L646,140 C646,190 714,190 714,140 L790,140" fill="none" stroke="#2a7fc1" stroke-width="4"/><path d="M648.1,161.6 l-4,-8 m4,8 l4,-8" stroke="#6d3fc0" stroke-width="2.5"/><circle cx="648.1" cy="149.6" r="4" fill="#ffd166" stroke="#22313f" stroke-width="1"/><path d="M657.2,175.3 l-4,-8 m4,8 l4,-8" stroke="#6d3fc0" stroke-width="2.5"/><circle cx="657.2" cy="163.3" r="4" fill="#ffd166" stroke="#22313f" stroke-width="1"/><path d="M671.8,183.0 l-4,-8 m4,8 l4,-8" stroke="#6d3fc0" stroke-width="2.5"/><circle cx="671.8" cy="171.0" r="4" fill="#ffd166" stroke="#22313f" stroke-width="1"/><path d="M688.2,183.0 l-4,-8 m4,8 l4,-8" stroke="#6d3fc0" stroke-width="2.5"/><circle cx="688.2" cy="171.0" r="4" fill="#ffd166" stroke="#22313f" stroke-width="1"/><path d="M702.8,175.3 l-4,-8 m4,8 l4,-8" stroke="#6d3fc0" stroke-width="2.5"/><circle cx="702.8" cy="163.3" r="4" fill="#ffd166" stroke="#22313f" stroke-width="1"/><path d="M711.9,161.6 l-4,-8 m4,8 l4,-8" stroke="#6d3fc0" stroke-width="2.5"/><circle cx="711.9" cy="149.6" r="4" fill="#ffd166" stroke="#22313f" stroke-width="1"/><circle cx="680" cy="235" r="22" fill="#fff" stroke="#2a7fc1" stroke-width="3"/><line x1="680.0" y1="192.0" x2="680.0" y2="208.0" stroke="#22313f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><text x="680.0" y="278.0" font-size="13" text-anchor="middle" font-weight="900" fill="#22313f" >receptores específicos</text>
<path d="M840,140 L924,140 C924,120 976,120 976,140 L1060,140" fill="none" stroke="#2a7fc1" stroke-width="4"/><circle cx="936" cy="110" r="3" fill="#3f8a3a"/><circle cx="943" cy="102" r="3" fill="#3f8a3a"/><circle cx="950" cy="110" r="3" fill="#3f8a3a"/><circle cx="957" cy="102" r="3" fill="#3f8a3a"/><circle cx="964" cy="110" r="3" fill="#3f8a3a"/><circle cx="950" cy="230" r="22" fill="#e5f4ec" stroke="#2a7fc1" stroke-width="3"/><circle cx="941" cy="230" r="3" fill="#3f8a3a"/><circle cx="947" cy="235" r="3" fill="#3f8a3a"/><circle cx="953" cy="230" r="3" fill="#3f8a3a"/><circle cx="959" cy="235" r="3" fill="#3f8a3a"/><line x1="950.0" y1="205.0" x2="950.0" y2="160.0" stroke="#3f8a3a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><text x="950.0" y="272.0" font-size="13" text-anchor="middle" font-weight="900" fill="#22313f" >vesícula de secreción</text>
<text x="560.0" y="380.0" font-size="14" text-anchor="middle" font-weight="900" fill="#0f4c81" >Endocitosis: la membrana se invagina y forma una vesícula hacia dentro · Exocitosis: una vesícula se fusiona con la membrana</text>
</svg>
