<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Células animales y vegetales en medios hipotónico, isotónico e hipertónico</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="90" y="20" width="280" height="440" rx="18" fill="#e3f2fd" stroke="#c3ccd4"/><text x="230.0" y="52.0" font-size="18" text-anchor="middle" font-weight="900" fill="#0f4c81" >Medio hipotónico</text>
<text x="230.0" y="74.0" font-size="14" text-anchor="middle" font-weight="800" fill="#4c5b67" >entra agua</text>
<rect x="390" y="20" width="280" height="440" rx="18" fill="#f4f8fb" stroke="#c3ccd4"/><text x="530.0" y="52.0" font-size="18" text-anchor="middle" font-weight="900" fill="#0f4c81" >Medio isotónico</text>
<text x="530.0" y="74.0" font-size="14" text-anchor="middle" font-weight="800" fill="#4c5b67" >sin cambio neto</text>
<rect x="690" y="20" width="280" height="440" rx="18" fill="#fff2e0" stroke="#c3ccd4"/><text x="830.0" y="52.0" font-size="18" text-anchor="middle" font-weight="900" fill="#0f4c81" >Medio hipertónico</text>
<text x="830.0" y="74.0" font-size="14" text-anchor="middle" font-weight="800" fill="#4c5b67" >sale agua</text>
<text x="40.0" y="170.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c0392b" transform="rotate(-90 40 170)">Célula</text>
<text x="40.0" y="360.0" font-size="15" text-anchor="middle" font-weight="900" fill="#3f8a3a" transform="rotate(-90 40 360)">Célula</text>
<text x="62.0" y="170.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c0392b" transform="rotate(-90 62 170)">animal</text>
<text x="62.0" y="360.0" font-size="15" text-anchor="middle" font-weight="900" fill="#3f8a3a" transform="rotate(-90 62 360)">vegetal</text>
<circle cx="230" cy="160" r="56" fill="#f7c6c0" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6"/><text x="230.0" y="244.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c0392b" >se hincha y estalla</text>
<text x="230.0" y="260.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >(lisis; hemólisis)</text>
<ellipse cx="530" cy="160" rx="54" ry="40" fill="#f7c6c0" stroke="#c0392b" stroke-width="3"/><ellipse cx="530" cy="160" rx="22" ry="14" fill="#f0a49a"/><text x="530.0" y="244.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c0392b" >normal</text>
<path d="M790,160 l14,-30 l18,8 l20,-20 l10,26 l22,6 l-12,24 l12,22 l-24,6 l-8,24 l-20,-14 l-18,12 l-6,-24 l-22,-8 z" fill="#f7c6c0" stroke="#c0392b" stroke-width="3"/><text x="830.0" y="244.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c0392b" >se arruga</text>
<text x="830.0" y="260.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >(crenación)</text>
<rect x="170" y="310" width="120" height="100" rx="8" fill="none" stroke="#5b8c2a" stroke-width="7"/><rect x="174.0" y="314.0" width="112" height="92" rx="8" fill="#e6f2d9" stroke="#2a7fc1" stroke-width="2.5"/><rect x="189.0" y="329.0" width="82" height="62" rx="6" fill="#cfe8fa" stroke="#4a8fc1" stroke-width="1.5"/><text x="230.0" y="440.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >turgente</text>
<text x="230.0" y="456.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >(la pared impide que estalle)</text>
<rect x="470" y="310" width="120" height="100" rx="8" fill="none" stroke="#5b8c2a" stroke-width="7"/><rect x="477.0" y="317.0" width="106" height="86" rx="11" fill="#e6f2d9" stroke="#2a7fc1" stroke-width="2.5"/><rect x="492.0" y="332.0" width="76" height="56" rx="9" fill="#cfe8fa" stroke="#4a8fc1" stroke-width="1.5"/><text x="530.0" y="440.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >flácida</text>
<rect x="770" y="310" width="120" height="100" rx="8" fill="none" stroke="#5b8c2a" stroke-width="7"/><rect x="796.0" y="336.0" width="68" height="48" rx="30" fill="#e6f2d9" stroke="#2a7fc1" stroke-width="2.5"/><rect x="811.0" y="351.0" width="38" height="18" rx="28" fill="#cfe8fa" stroke="#4a8fc1" stroke-width="1.5"/><text x="830.0" y="440.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >plasmólisis</text>
<text x="830.0" y="456.0" font-size="12" text-anchor="middle" font-weight="800" fill="#4c5b67" >(la membrana se separa de la pared)</text>
<line x1="130.0" y1="110.0" x2="160.0" y2="130.0" stroke="#0f4c81" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><text x="130.0" y="100.0" font-size="13" text-anchor="middle" font-weight="900" fill="#0f4c81" >H₂O</text>
<line x1="900.0" y1="130.0" x2="930.0" y2="110.0" stroke="#0f4c81" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fk)"/><text x="934.0" y="100.0" font-size="13" text-anchor="middle" font-weight="900" fill="#0f4c81" >H₂O</text>
</svg>
