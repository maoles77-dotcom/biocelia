<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 614" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Genoma procariota y eucariota</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<text x="250.0" y="30.0" font-size="22" text-anchor="middle" font-weight="900" fill="#0f4c81" >Procariota (bacteria)</text>
<text x="750.0" y="30.0" font-size="22" text-anchor="middle" font-weight="900" fill="#0f4c81" >Eucariota</text>
<rect x="40" y="55" width="420" height="250" rx="110" fill="#f2f8ec" stroke="#3f8a3a" stroke-width="4"/><path d="M140,180 C140,110 260,100 300,140 C340,180 380,150 360,210 C340,260 250,250 220,240 C170,225 140,230 140,180z" fill="none" stroke="#1f5f99" stroke-width="5"/><circle cx="400" cy="120" r="18" fill="none" stroke="#c77d00" stroke-width="4"/><circle cx="110" cy="250" r="14" fill="none" stroke="#c77d00" stroke-width="4"/><text x="250.0" y="180.0" font-size="15" text-anchor="middle" font-weight="900" fill="#1f5f99" >nucleoide</text>
<text x="250.0" y="200.0" font-size="14" text-anchor="middle" font-weight="800" fill="#1f5f99" >ADN circular</text>
<line x1="400.0" y1="138.0" x2="250.0" y2="328.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><text x="250.0" y="344.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c77d00" >plásmidos</text>
<line x1="110.0" y1="264.0" x2="250.0" y2="328.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><text x="250.0" y="370.0" font-size="14" text-anchor="middle" font-weight="800" fill="#4c5b67" >Sin envoltura nuclear · en el citoplasma</text>
