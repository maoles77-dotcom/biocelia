<line x1="855.0" y1="240.0" x2="940.0" y2="345.0" stroke="#4c5b67" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><text x="940.0" y="361.0" font-size="15" text-anchor="middle" font-weight="900" fill="#b5651d" >histonas</text>
<text x="750.0" y="370.0" font-size="14" text-anchor="middle" font-weight="800" fill="#4c5b67" >Varios cromosomas lineales en el núcleo</text>
<rect x="20" y="400" width="960" height="34" fill="#f6f9fb"/><text x="40.0" y="423.0" font-size="15" text-anchor="start" font-weight="900" fill="#0f4c81" >Molécula</text>
<text x="330.0" y="423.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >una, circular</text>
<text x="740.0" y="423.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >varias, lineales</text>
<rect x="20" y="434" width="960" height="34" fill="#fff"/><text x="40.0" y="457.0" font-size="15" text-anchor="start" font-weight="900" fill="#0f4c81" >Localización</text>
<text x="330.0" y="457.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >nucleoide (citoplasma)</text>
<text x="740.0" y="457.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >núcleo (+ mitocondrias, cloroplastos)</text>
<rect x="20" y="468" width="960" height="34" fill="#f6f9fb"/><text x="40.0" y="491.0" font-size="15" text-anchor="start" font-weight="900" fill="#0f4c81" >Proteínas</text>
<text x="330.0" y="491.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >sin histonas</text>
<text x="740.0" y="491.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >asociado a histonas</text>
<rect x="20" y="502" width="960" height="34" fill="#fff"/><text x="40.0" y="525.0" font-size="15" text-anchor="start" font-weight="900" fill="#0f4c81" >Genes</text>
<text x="330.0" y="525.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >continuos, sin intrones</text>
<text x="740.0" y="525.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >con exones e intrones</text>
<rect x="20" y="536" width="960" height="34" fill="#f6f9fb"/><text x="40.0" y="559.0" font-size="15" text-anchor="start" font-weight="900" fill="#0f4c81" >ADN no codificante</text>
<text x="330.0" y="559.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >escaso</text>
<text x="740.0" y="559.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >abundante</text>
<rect x="20" y="570" width="960" height="34" fill="#fff"/><text x="40.0" y="593.0" font-size="15" text-anchor="start" font-weight="900" fill="#0f4c81" >Plásmidos</text>
<text x="330.0" y="593.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >frecuentes</text>
<text x="740.0" y="593.0" font-size="15" text-anchor="middle" font-weight="800" fill="#22313f" >raros (algunas levaduras)</text>
