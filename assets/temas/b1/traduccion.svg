</g><text x="210.0" y="330.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >La subunidad menor se une al ARNm</text>
<text x="210.0" y="349.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >y localiza el codón AUG.</text>
<text x="210.0" y="368.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >ARNt-Met (anticodón UAC) en el sitio P;</text>
<text x="210.0" y="387.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >después se une la subunidad mayor.</text>
