</g><text x="610.0" y="330.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >Entra un ARNt-aa en el sitio A.</text>
<text x="610.0" y="349.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >Enlace peptídico (peptidil transferasa).</text>
<text x="610.0" y="368.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >Translocación: el ribosoma avanza un</text>
<text x="610.0" y="387.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >codón; el ARNt libre sale por el sitio E.</text>
