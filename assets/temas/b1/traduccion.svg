</g><text x="1010.0" y="330.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >Un codón de parada (UAA, UAG, UGA)</text>
<text x="1010.0" y="349.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >llega al sitio A: entra un factor de</text>
<text x="1010.0" y="368.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >liberación (FL), se libera el polipéptido</text>
<text x="1010.0" y="387.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >y se separan las subunidades.</text>
<text x="620.0" y="438.0" font-size="14" text-anchor="middle" font-weight="900" fill="#0f4c81" >Codones: AUG (Met) · GCU (Ala) · UUC (Phe) · UAA (parada). Los anticodones se leen 3'→5'.</text>
