<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Estructura de un gen procariota y de un gen eucariota</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<text x="30.0" y="40.0" font-size="20" text-anchor="start" font-weight="900" fill="#0f4c81" >Gen procariota: continuo</text>
<line x1="20.0" y1="83.0" x2="980.0" y2="83.0" stroke="#4c5b67" stroke-width="4" stroke-linecap="round" /><rect x="60" y="60" width="150" height="46" rx="6" fill="#fff4df" stroke="#c77d00" stroke-width="2"/><text x="135.0" y="89.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c77d00" >promotor</text>
<rect x="220" y="60" width="600" height="46" rx="6" fill="#1f5f99" stroke="#1f5f99" stroke-width="2"/><text x="520.0" y="89.0" font-size="15" text-anchor="middle" font-weight="900" fill="#fff" >región codificante continua</text>
<rect x="830" y="60" width="130" height="46" rx="6" fill="#fde8e6" stroke="#c0392b" stroke-width="2"/><text x="895.0" y="89.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c0392b" >terminador</text>
<text x="520.0" y="135.0" font-size="14" text-anchor="middle" font-weight="800" fill="#4c5b67" >A menudo varios genes seguidos se transcriben en un solo ARNm (policistrónico, operón)</text>
<text x="30.0" y="190.0" font-size="20" text-anchor="start" font-weight="900" fill="#0f4c81" >Gen eucariota: fragmentado</text>
<line x1="20.0" y1="233.0" x2="980.0" y2="233.0" stroke="#4c5b67" stroke-width="4" stroke-linecap="round" /><rect x="60" y="210" width="150" height="46" rx="6" fill="#fff4df" stroke="#c77d00" stroke-width="2"/><text x="135.0" y="239.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c77d00" >promotor</text>
<rect x="220" y="210" width="130" height="46" rx="6" fill="#1f5f99" stroke="#1f5f99" stroke-width="2"/><text x="285.0" y="239.0" font-size="15" text-anchor="middle" font-weight="900" fill="#fff" >exón</text>
<rect x="352" y="210" width="110" height="46" rx="6" fill="#e9edf0" stroke="#9aa7b2" stroke-width="2"/><text x="407.0" y="239.0" font-size="15" text-anchor="middle" font-weight="900" fill="#4c5b67" >intrón</text>
<rect x="464" y="210" width="120" height="46" rx="6" fill="#1f5f99" stroke="#1f5f99" stroke-width="2"/><text x="524.0" y="239.0" font-size="15" text-anchor="middle" font-weight="900" fill="#fff" >exón</text>
<rect x="586" y="210" width="110" height="46" rx="6" fill="#e9edf0" stroke="#9aa7b2" stroke-width="2"/><text x="641.0" y="239.0" font-size="15" text-anchor="middle" font-weight="900" fill="#4c5b67" >intrón</text>
<rect x="698" y="210" width="120" height="46" rx="6" fill="#1f5f99" stroke="#1f5f99" stroke-width="2"/><text x="758.0" y="239.0" font-size="15" text-anchor="middle" font-weight="900" fill="#fff" >exón</text>
<rect x="830" y="210" width="130" height="46" rx="6" fill="#fde8e6" stroke="#c0392b" stroke-width="2"/><text x="895.0" y="239.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c0392b" >terminador</text>
<text x="520.0" y="285.0" font-size="14" text-anchor="middle" font-weight="800" fill="#4c5b67" >Exones: se expresan · Intrones: se transcriben pero se eliminan en la maduración (monocistrónico)</text>
</svg>
