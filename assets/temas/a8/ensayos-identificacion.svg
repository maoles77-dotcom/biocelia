<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 810" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Resultados de los ensayos de Benedict, Lugol, Biuret y Sudán</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<text x="130.0" y="28.0" font-size="15" text-anchor="middle" font-weight="900" fill="#4c5b67" >Ensayo</text>
<text x="330.0" y="28.0" font-size="15" text-anchor="middle" font-weight="900" fill="#4c5b67" >Negativo</text>
<text x="430.0" y="28.0" font-size="15" text-anchor="middle" font-weight="900" fill="#4c5b67" >Positivo</text>
<text x="700.0" y="28.0" font-size="15" text-anchor="middle" font-weight="900" fill="#4c5b67" >Detecta · cambio · ejemplos +</text>
<rect x="10" y="40" width="1000" height="180" rx="14" fill="#f6f9fb"/><text x="130.0" y="130.0" font-size="24" text-anchor="middle" font-weight="900" fill="#0f4c81" >Benedict</text>
<path d="M308,50 V170 A22,22 0 0 0 352,170 V50" fill="#fff" stroke="#7b8a97" stroke-width="3"/><path d="M310,95 V170 A20,20 0 0 0 350,170 V95z" fill="#3b7dd8"/><path d="M408,50 V170 A22,22 0 0 0 452,170 V50" fill="#fff" stroke="#7b8a97" stroke-width="3"/><path d="M410,95 V170 A20,20 0 0 0 450,170 V95z" fill="#c0392b"/><text x="560.0" y="100.0" font-size="18" text-anchor="start" font-weight="900" fill="#0f4c81" >glúcidos reductores</text>
<text x="560.0" y="130.0" font-size="15" text-anchor="start" font-weight="800" fill="#22313f" >azul → rojo ladrillo</text>
<text x="560.0" y="158.0" font-size="14" text-anchor="start" font-weight="700" fill="#4c5b67" >+ glucosa, fructosa, maltosa, lactosa</text>
<rect x="10" y="230" width="1000" height="180" rx="14" fill="#fff"/><text x="130.0" y="320.0" font-size="24" text-anchor="middle" font-weight="900" fill="#0f4c81" >Lugol</text>
<path d="M308,240 V360 A22,22 0 0 0 352,360 V240" fill="#fff" stroke="#7b8a97" stroke-width="3"/><path d="M310,285 V360 A20,20 0 0 0 350,360 V285z" fill="#d9a441"/><path d="M408,240 V360 A22,22 0 0 0 452,360 V240" fill="#fff" stroke="#7b8a97" stroke-width="3"/><path d="M410,285 V360 A20,20 0 0 0 450,360 V285z" fill="#1f2a5a"/><text x="560.0" y="290.0" font-size="18" text-anchor="start" font-weight="900" fill="#0f4c81" >almidón</text>
<text x="560.0" y="320.0" font-size="15" text-anchor="start" font-weight="800" fill="#22313f" >amarillo-pardo → azul-negro</text>
<text x="560.0" y="348.0" font-size="14" text-anchor="start" font-weight="700" fill="#4c5b67" >+ patata, harina, pan</text>
<rect x="10" y="420" width="1000" height="180" rx="14" fill="#f6f9fb"/><text x="130.0" y="510.0" font-size="24" text-anchor="middle" font-weight="900" fill="#0f4c81" >Biuret</text>
<path d="M308,430 V550 A22,22 0 0 0 352,550 V430" fill="#fff" stroke="#7b8a97" stroke-width="3"/><path d="M310,475 V550 A20,20 0 0 0 350,550 V475z" fill="#7fb3e6"/><path d="M408,430 V550 A22,22 0 0 0 452,550 V430" fill="#fff" stroke="#7b8a97" stroke-width="3"/><path d="M410,475 V550 A20,20 0 0 0 450,550 V475z" fill="#7b3fb0"/><text x="560.0" y="480.0" font-size="18" text-anchor="start" font-weight="900" fill="#0f4c81" >proteínas</text>
<text x="560.0" y="510.0" font-size="15" text-anchor="start" font-weight="800" fill="#22313f" >azul → violeta</text>
<text x="560.0" y="538.0" font-size="14" text-anchor="start" font-weight="700" fill="#4c5b67" >+ clara de huevo, leche</text>
<rect x="10" y="610" width="1000" height="180" rx="14" fill="#fff"/><text x="130.0" y="700.0" font-size="24" text-anchor="middle" font-weight="900" fill="#0f4c81" >Sudán</text>
<path d="M308,620 V740 A22,22 0 0 0 352,740 V620" fill="#fff" stroke="#7b8a97" stroke-width="3"/><path d="M310,665 V740 A20,20 0 0 0 350,740 V665z" fill="#d6ecfa"/><path d="M408,620 V740 A22,22 0 0 0 452,740 V620" fill="#fff" stroke="#7b8a97" stroke-width="3"/><path d="M410,665 V740 A20,20 0 0 0 450,740 V665z" fill="#d6ecfa"/><rect x="410" y="665" width="40" height="22" fill="#e8562a"/><text x="560.0" y="670.0" font-size="18" text-anchor="start" font-weight="900" fill="#0f4c81" >lípidos</text>
<text x="560.0" y="700.0" font-size="15" text-anchor="start" font-weight="800" fill="#22313f" >se tiñe de rojo la capa de grasa</text>
<text x="560.0" y="728.0" font-size="14" text-anchor="start" font-weight="700" fill="#4c5b67" >+ aceite, mantequilla</text>
</svg>
