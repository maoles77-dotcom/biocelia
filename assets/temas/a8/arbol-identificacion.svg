<line x1="450" y1="56" x2="450" y2="96" stroke="#22313f" stroke-width="2.5" marker-end="url(#fk)"/><rect x="100.0" y="188" width="200" height="44" rx="12" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2"/><text x="200.0" y="215.0" font-size="15" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Hay almidón</text>
<line x1="370" y1="130" x2="250" y2="188" stroke="#22313f" stroke-width="2.5" marker-end="url(#fk)"/><text x="316.0" y="155.0" font-size="13" text-anchor="start" font-weight="900" fill="#c77d00" >sí</text>
<rect x="530.0" y="188" width="240" height="44" rx="12" fill="#fff4df" stroke="#c77d00" stroke-width="2"/><text x="650.0" y="215.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c77d00" >¿Benedict rojo?</text>
<line x1="530" y1="130" x2="620" y2="188" stroke="#22313f" stroke-width="2.5" marker-end="url(#fk)"/><text x="581.0" y="155.0" font-size="13" text-anchor="start" font-weight="900" fill="#c77d00" >no</text>
<rect x="380.0" y="278" width="240" height="44" rx="12" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2"/><text x="500.0" y="305.0" font-size="15" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Glúcido reductor</text>
<line x1="610" y1="232" x2="540" y2="278" stroke="#22313f" stroke-width="2.5" marker-end="url(#fk)"/><text x="581.0" y="251.0" font-size="13" text-anchor="start" font-weight="900" fill="#c77d00" >sí</text>
<rect x="660.0" y="278" width="280" height="44" rx="12" fill="#fff4df" stroke="#c77d00" stroke-width="2"/><text x="800.0" y="305.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c77d00" >Hidrolizar y repetir Benedict</text>
<line x1="690" y1="232" x2="770" y2="278" stroke="#22313f" stroke-width="2.5" marker-end="url(#fk)"/><text x="736.0" y="251.0" font-size="13" text-anchor="start" font-weight="900" fill="#c77d00" >no</text>
<rect x="550.0" y="368" width="260" height="44" rx="12" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2"/><text x="680.0" y="395.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Rojo: disacárido no</text>
<text x="680.0" y="425.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >reductor (sacarosa)</text>
<line x1="790" y1="322" x2="720" y2="368" stroke="#22313f" stroke-width="2.5" marker-end="url(#fk)"/><text x="450.0" y="470.0" font-size="14" text-anchor="middle" font-weight="800" fill="#4c5b67" >Biuret violeta → proteínas · Sudán rojo → lípidos (se aplican aparte).</text>
