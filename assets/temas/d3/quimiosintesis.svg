<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 380" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Quimiosíntesis: oxidación de compuestos inorgánicos y fijación de CO2</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="10" y="10" width="1000" height="360" rx="20" fill="#f6f2fb" stroke="#6d3fc0" stroke-width="2.5"/><text x="510.0" y="44.0" font-size="18" text-anchor="middle" font-weight="900" fill="#6d3fc0" >Quimiosíntesis: energía química de compuestos inorgánicos, sin luz</text>
<rect x="40" y="80" width="400" height="230" rx="16" fill="#fff" stroke="#6d3fc0" stroke-width="2"/><text x="240.0" y="108.0" font-size="15" text-anchor="middle" font-weight="900" fill="#6d3fc0" >1 · Oxidación de sustancias inorgánicas</text>
<text x="60.0" y="146.0" font-size="15" text-anchor="start" font-weight="900" fill="#22313f" >NH₃ → NO₂⁻</text>
<text x="60.0" y="164.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >bacterias nitrosificantes (Nitrosomonas)</text>
<text x="60.0" y="186.0" font-size="15" text-anchor="start" font-weight="900" fill="#22313f" >NO₂⁻ → NO₃⁻</text>
<text x="60.0" y="204.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >bacterias nitrificantes (Nitrobacter)</text>
<text x="60.0" y="226.0" font-size="15" text-anchor="start" font-weight="900" fill="#22313f" >H₂S → S → SO₄²⁻</text>
<text x="60.0" y="244.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >bacterias incoloras del azufre</text>
<text x="60.0" y="266.0" font-size="15" text-anchor="start" font-weight="900" fill="#22313f" >Fe²⁺ → Fe³⁺</text>
<text x="60.0" y="284.0" font-size="12" text-anchor="start" font-weight="800" fill="#4c5b67" >bacterias del hierro</text>
<line x1="450.0" y1="195.0" x2="560.0" y2="195.0" stroke="#6d3fc0" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fk)"/><rect x="485.91" y="146" width="38.18" height="28" rx="14" fill="#fff4df" stroke="#c77d00" stroke-width="2"/><text x="505.0" y="165.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c77d00" >ATP</text>
<rect x="481.88" y="218" width="46.24" height="28" rx="14" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2"/><text x="505.0" y="237.0" font-size="13" text-anchor="middle" font-weight="900" fill="#6d3fc0" >NADH</text>
<rect x="580" y="80" width="400" height="230" rx="16" fill="#fff" stroke="#c77d00" stroke-width="2"/><text x="780.0" y="108.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c77d00" >2 · Fijación del CO₂ (ciclo de Calvin)</text>
<circle cx="780" cy="200" r="58" fill="#fff" stroke="#c77d00" stroke-width="5"/><text x="780.0" y="196.0" font-size="13" text-anchor="middle" font-weight="900" fill="#c77d00" >ciclo de</text>
<text x="780.0" y="214.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c77d00" >Calvin</text>
<rect x="620.91" y="136" width="38.18" height="28" rx="14" fill="#eef1f4" stroke="#4c5b67" stroke-width="2"/><text x="640.0" y="155.0" font-size="13" text-anchor="middle" font-weight="900" fill="#4c5b67" >CO₂</text>
<line x1="660.0" y1="160.0" x2="724.0" y2="182.0" stroke="#4c5b67" stroke-width="2" stroke-linecap="round" marker-end="url(#fk)"/><rect x="828.52" y="256" width="142.96" height="28" rx="14" fill="#e5f4ec" stroke="#3f8a3a" stroke-width="2"/><text x="900.0" y="275.0" font-size="13" text-anchor="middle" font-weight="900" fill="#3f8a3a" >materia orgánica</text>
<line x1="830.0" y1="236.0" x2="880.0" y2="258.0" stroke="#3f8a3a" stroke-width="2" stroke-linecap="round" marker-end="url(#fk)"/><text x="510.0" y="345.0" font-size="13" text-anchor="middle" font-weight="800" fill="#0f4c81" >Son bacterias quimioautótrofas: cierran ciclos biogeoquímicos (nitrógeno, azufre) y sostienen ecosistemas sin luz (fuentes hidrotermales).</text>
</svg>
