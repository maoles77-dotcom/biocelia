<line x1="230.0" y1="202.0" x2="190.0" y2="272.0" stroke="#4c5b67" stroke-width="1.3" stroke-linecap="round" /><text x="186.0" y="278.0" font-size="13" text-anchor="end" font-weight="900" fill="#c0392b" >surco</text>
<rect x="470" y="10" width="440" height="300" rx="14" fill="#f6f9fb" stroke="#d5dde3"/><text x="690.0" y="34.0" font-size="15" text-anchor="middle" font-weight="900" fill="#3f8a3a" >Célula vegetal: fragmoplasto</text>
<text x="690.0" y="298.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >vesículas del Golgi se fusionan → placa celular → nueva pared</text>
