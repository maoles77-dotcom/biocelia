<line x1="694.0" y1="180.0" x2="660.0" y2="274.0" stroke="#4c5b67" stroke-width="1.3" stroke-linecap="round" /><text x="656.0" y="280.0" font-size="13" text-anchor="end" font-weight="900" fill="#3f8a3a" >placa celular</text>
<text x="460.0" y="340.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >En las células vegetales tampoco hay centriolos: el huso se forma sin ellos y sin áster (huso anastral).</text>
