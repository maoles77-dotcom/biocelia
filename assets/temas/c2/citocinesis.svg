<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 355" role="img" font-family="Nunito, 'Segoe UI', system-ui, sans-serif"><title>Citocinesis por estrangulamiento en la célula animal y por fragmoplasto en la vegetal</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fc1"/></marker><marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22313f"/></marker><radialGradient id="gO" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#f08a7e"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gH" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dde3"/></radialGradient></defs>
<rect x="10" y="10" width="440" height="300" rx="14" fill="#f6f9fb" stroke="#d5dde3"/><text x="230.0" y="34.0" font-size="15" text-anchor="middle" font-weight="900" fill="#c0392b" >Célula animal: estrangulamiento</text>
<text x="230.0" y="298.0" font-size="11.5" text-anchor="middle" font-weight="800" fill="#4c5b67" >anillo contráctil de actina y miosina → surco de segmentación</text>
