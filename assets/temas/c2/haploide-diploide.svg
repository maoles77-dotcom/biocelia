<text x="450.0" y="350.0" font-size="13" text-anchor="middle" font-weight="800" fill="#4c5b67" >La meiosis reduce a la mitad el número de cromosomas y la fecundación lo restablece: se mantiene constante en la especie.</text>
<text x="450.0" y="370.0" font-size="14" text-anchor="middle" font-weight="900" fill="#0f4c81" >Especie humana: 2n = 46 (células somáticas) · n = 23 (gametos)</text>
