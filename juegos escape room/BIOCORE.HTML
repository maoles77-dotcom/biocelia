const NIV = {
  basico:     { nombre:'🟢 Básico',     tiempo: JUEGO.tiempos?.basico     ?? 900, pistas:3, castigo:0,  intentos:3, desc:'Conceptos y definiciones. 3 pistas, los errores no restan tiempo.' },
  intermedio: { nombre:'🟡 Intermedio', tiempo: JUEGO.tiempos?.intermedio ?? 720, pistas:2, castigo:20, intentos:3, desc:'Aplicación a casos y problemas. 2 pistas; cada error resta 20 s.' },
  pau:        { nombre:'🔴 PAU',        tiempo: JUEGO.tiempos?.pau        ?? 600, pistas:1, castigo:45, intentos:2, desc:'Preguntas competenciales y relaciones entre temas. 1 pista; cada error resta 45 s.' }
};
let P = null, reloj = null;
const $ = id => document.getElementById(id);
const barajar = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ ]/g, ' ').replace(/\s+/g, ' ').trim();
const mmss = t => `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
const record = (k, v) => { try { const c = 'escape-' + JUEGO.id + '-' + k, p = +localStorage.getItem(c) || 0; if (v !== undefined && v > p) localStorage.setItem(c, v); return Math.max(p, v || 0); } catch (e) { return v || 0; } };

function pintarInicio() {
  $('intro').innerHTML = JUEGO.intro;
  $('nSalas').textContent = JUEGO.salas;
  $('niveles').innerHTML = Object.entries(NIV).map(([k, n]) => `
    <button class="nivel" onclick="empezar('${k}')"><b>${n.nombre}</b>
      <small>${n.desc} Tiempo: ${Math.round(n.tiempo / 60)} min. Banco: ${JUEGO.retos[k].length} retos.</small>
      <em>Tu mejor puntuación: ${record(k)} %</em></button>`).join('');
}

function ver(id) { document.querySelectorAll('.sala').forEach(s => s.classList.remove('on')); $(id).classList.add('on'); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function empezar(nivel) {
  const n = NIV[nivel];
  const retos = barajar(JUEGO.retos[nivel]).slice(0, JUEGO.salas);
  P = { nivel, n, retos, i: 0, t: n.tiempo, pistas: n.pistas, puntos: 0, estado: [], clave: '' };
  $('barra').classList.add('on');
  $('nivelTxt').textContent = n.nombre;
  clearInterval(reloj);
  reloj = setInterval(() => { P.t--; pintarBarra(); if (P.t <= 0) { clearInterval(reloj); fin(false); } }, 1000);
  reto();
}

function pintarBarra() {
  $('reloj').textContent = mmss(Math.max(0, P.t));
  $('reloj').classList.toggle('alerta', P.t <= 60);
  $('pistasTxt').textContent = P.pistas;
  $('pips').innerHTML = P.retos.map((_, i) => `<span class="pip ${P.estado[i] || (i === P.i ? 'actual' : '')}"></span>`).join('');
}

function reto() {
  if (P.i >= P.retos.length) return fin(true);
  const r = P.retos[P.i];
  P.intentos = 0; P.resuelto = false;
  let cuerpo = '';
  if (r.tipo === 'opciones') {
    P.ops = barajar(r.opciones.map((t, k) => ({ t, ok: k === 0 })));
    cuerpo = P.ops.map((o, k) => `<button class="opc" data-k="${k}" onclick="marcar(${k})">${o.t}</button>`).join('');
  } else if (r.tipo === 'texto') {
    cuerpo = `<input type="text" id="resp" placeholder="${r.formato || 'Escribe tu respuesta'}" autocomplete="off" onkeydown="if(event.key==='Enter')comprobar()">`;
  } else if (r.tipo === 'numero') {
    cuerpo = `<input type="number" step="any" id="resp" placeholder="${r.formato || 'Número'}" onkeydown="if(event.key==='Enter')comprobar()">`;
  } else if (r.tipo === 'orden') {
    P.orden = barajar(r.elementos.map((t, k) => ({ t, k })));
    const nums = r.elementos.map((_, k) => `<option value="${k}">${k + 1}.º</option>`).join('');
    cuerpo = P.orden.map((e, k) => `<div class="fila-orden"><span>${e.t}</span><select id="ord${k}"><option value="">—</option>${nums}</select></div>`).join('');
  }
  $('s-reto').innerHTML = `
    <div class="historia"><span class="etiqueta">// RETO ${P.i + 1} DE ${P.retos.length} · ${r.tema}</span>${r.escena}</div>
    <h2>${r.titulo}</h2>
    ${r.fuente ? `<span class="fuente">${r.fuente}</span>` : ''}
    <p class="pregunta">${r.pregunta}</p>
    <div id="cuerpo">${cuerpo}</div>
    <div class="botones">
      <button class="btn btn-p" id="bComprobar" onclick="comprobar()">Comprobar</button>
      <button class="btn btn-s" id="bPista" onclick="pista()" ${P.pistas > 0 && r.pista ? '' : 'disabled'}>💡 Pista</button>
    </div>
    <div class="msg" id="msg"></div>`;
  pintarBarra();
  ver('s-reto');
}

function marcar(k) {
  if (P.resuelto) return;
  P.sel = k;
  document.querySelectorAll('.opc').forEach(b => b.classList.toggle('sel', +b.dataset.k === k));
}

function evaluar(r) {
  if (r.tipo === 'opciones') { if (P.sel === undefined) return null; return P.ops[P.sel].ok; }
  if (r.tipo === 'texto') { const v = norm($('resp').value); if (!v) return null; return r.respuestas.some(a => v.includes(norm(a))) && !(r.rechazar || []).some(a => v.includes(norm(a))); }
  if (r.tipo === 'numero') { const v = $('resp').value; if (v === '') return null; return Math.abs(+v - r.valor) <= (r.tolerancia || 0); }
  if (r.tipo === 'orden') {
    const vals = P.orden.map((_, k) => $('ord' + k).value);
    if (vals.some(v => v === '')) return null;
    return P.orden.every((e, k) => +vals[k] === e.k);
  }
}

function comprobar() {
  if (P.resuelto) return;
  const r = P.retos[P.i];
  const res = evaluar(r);
  const m = $('msg');
  if (res === null) { m.className = 'msg mal'; m.textContent = 'Responde antes de comprobar.'; return; }
  if (res) {
    P.resuelto = true;
    P.estado[P.i] = P.estado[P.i] || 'hecho';
    if (P.estado[P.i] === 'hecho') P.puntos += P.intentos === 0 ? 2 : 1;
    P.clave += JUEGO.clave[P.i] || '•';
    if (r.tipo === 'opciones') document.querySelectorAll('.opc').forEach(b => { b.disabled = true; if (P.ops[+b.dataset.k].ok) b.classList.add('bien'); });
    m.className = 'msg ok';
    m.innerHTML = `✅ <b>Correcto.</b> ${r.explicacion}<br><br>🔑 Letra conseguida: <b>${JUEGO.clave[P.i] || '•'}</b>`;
    siguienteBoton();
  } else {
    P.intentos++;
    P.t = Math.max(1, P.t - P.n.castigo);
    if (r.tipo === 'opciones' && P.sel !== undefined) document.querySelector(`.opc[data-k="${P.sel}"]`).classList.add('malsel');
    if (P.intentos >= P.n.intentos) {
      P.resuelto = true; P.estado[P.i] = 'ayuda';
      P.clave += JUEGO.clave[P.i] || '•';
      if (r.tipo === 'opciones') document.querySelectorAll('.opc').forEach(b => { b.disabled = true; if (P.ops[+b.dataset.k].ok) b.classList.add('bien'); });
      m.className = 'msg mal';
      m.innerHTML = `❌ Se acabaron los intentos. <b>Solución:</b> ${r.solucion || r.opciones?.[0] || ''}<br>${r.explicacion}<br><br>🔑 Te damos la letra igualmente (reto marcado en naranja): <b>${JUEGO.clave[P.i] || '•'}</b>`;
      siguienteBoton();
    } else {
      m.className = 'msg mal';
      m.innerHTML = `❌ No es correcto${P.n.castigo ? ` (−${P.n.castigo} s)` : ''}. Te ${P.n.intentos - P.intentos === 1 ? 'queda 1 intento' : 'quedan ' + (P.n.intentos - P.intentos) + ' intentos'}.${r.feedback ? ' ' + r.feedback : ''}`;
    }
  }
  pintarBarra();
}

function siguienteBoton() {
  $('bComprobar').textContent = P.i + 1 < P.retos.length ? 'Siguiente reto ▶' : 'Abrir la salida 🔓';
  $('bComprobar').onclick = () => { P.i++; reto(); };
  $('bPista').disabled = true;
}

function pista() {
  const r = P.retos[P.i];
  if (P.pistas <= 0 || !r.pista || P.resuelto) return;
  P.pistas--; P.t = Math.max(1, P.t - 30);
  const m = $('msg'); m.className = 'msg pista'; m.innerHTML = '💡 ' + r.pista + ' <i>(−30 s)</i>';
  $('bPista').disabled = true;
  pintarBarra();
}

function fin(ok) {
  clearInterval(reloj);
  const max = P.retos.length * 2;
  const pct = ok ? Math.round(P.puntos / max * 100) : 0;
  const mejor = record(P.nivel, pct);
  const temas = [...new Set(P.retos.filter((_, i) => P.estado[i] === 'ayuda').map(r => r.tema))];
  $('s-fin').innerHTML = ok ? `
      <div class="centro"><h2 style="font-size:1.6rem">${JUEGO.victoria}</h2>
      <p>Clave de salida:</p><div class="clave">${P.clave}</div>
      <p>${P.n.nombre} · Puntuación: <b>${P.puntos} / ${max}</b> (${pct} %) · Tiempo sobrante: ${mmss(Math.max(0, P.t))}<br><small>Tu mejor resultado en este nivel: ${mejor} %</small></p></div>
      <div class="historia"><span class="etiqueta">// QUÉ REPASAR</span>${temas.length ? '<ul class="resumen">' + temas.map(t => `<li>${t}</li>`).join('') + '</ul>' : 'Has resuelto todos los retos sin agotar los intentos. ¡Prueba el nivel siguiente!'}</div>`
    : `<div class="centro"><h2 style="font-size:1.6rem;color:var(--mal)">⏳ Tiempo agotado</h2><p>${JUEGO.derrota}</p></div>`;
  $('s-fin').innerHTML += `<div class="botones" style="justify-content:center"><button class="btn btn-p" onclick="volver()">🔄 Jugar otra vez (otros retos)</button></div>`;
  ver('s-fin');
}

function volver() { clearInterval(reloj); $('barra').classList.remove('on'); pintarInicio(); ver('s-inicio'); }
pintarInicio();
</script>
